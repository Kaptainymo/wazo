<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wazo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;600&family=Miriam+Libre:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Mobile-first, Currency-style: the home screen is three full-bleed bands (your idea, examples, yours).
   Tap a band and it opens full screen. A receipt is a stack of big-type rows; when the verdict is
   revealed the whole sheet floods with the verdict color: BUILD green, PIVOT amber, KILL red. */
:root{
  --bg:#F6F5F2; --ink:#111; --muted:#77756F; --line:#D9D8D3; --red:#F07167;
  --b1:#111111; --b1-ink:#F4F3EF; --b2:#E6E5E0; --b2-ink:#111; --b3:#F6F5F2; --b3-ink:#111;
  --night:#161616; --night-ink:#F4F3EF;
  --build:#A8DADC; --build-ink:#0F2A2C; --pivot:#F1FAEE; --pivot-ink:#1B2626; --kill:#F07167; --kill-ink:#2B0B07;
  --cta-h:52px;
  --f-sans:"Hanken Grotesk","IBM Plex Sans Hebrew","Segoe UI",system-ui,sans-serif;
  --f-wide:"Unbounded","Miriam Libre","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","IBM Plex Sans Hebrew",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --ink:#F1F0EC; --muted:#8E8C87; --line:#2A2A2A;
  --b1:#000; --b1-ink:#F4F3EF; --b2:#1C1C1C; --b2-ink:#F1F0EC; --b3:#0E0E0E; --b3-ink:#F1F0EC; --night:#0A0A0A; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E0E; --ink:#F1F0EC; --muted:#8E8C87; --line:#2A2A2A;
  --b1:#000; --b1-ink:#F4F3EF; --b2:#1C1C1C; --b2-ink:#F1F0EC; --b3:#0E0E0E; --b3-ink:#F1F0EC; --night:#0A0A0A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
html.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.in{width:100%;max-width:680px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left,0px))}

/* nav */
nav.top{position:sticky;top:0;z-index:20;background:var(--b1);color:var(--b1-ink);padding-top:env(safe-area-inset-top,0px)}
nav.top .in{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:none}
.brand{font-weight:700;font-size:19px;letter-spacing:-.02em;direction:ltr;text-decoration:none;color:inherit;display:flex;gap:2px;align-items:flex-start}
.brand sup{font-size:9px;margin-top:3px}
.navr{display:flex;gap:6px;align-items:center;position:relative}
.ts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80}
.ts:empty{display:none}
#ideaPlans,#gatePlans{margin-top:14px}
.langmenu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;min-width:220px;background:var(--b1);color:var(--b1-ink);border-radius:18px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.28);border:1px solid color-mix(in srgb,currentColor 14%,transparent);z-index:40;transform-origin:top right;animation:menuIn .24s var(--ease) both}
[dir=rtl] .langmenu{transform-origin:top left}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
.lopt{display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;padding:12px 14px;border:0;background:transparent;color:inherit;border-radius:12px;font:inherit;font-size:16px;font-weight:500;text-align:start;cursor:pointer}
.lopt:hover,.lopt:focus-visible{background:color-mix(in srgb,currentColor 9%,transparent);outline:none}
.lopt small{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;opacity:.55}
.lopt[aria-checked="true"] small{opacity:1}
.lopt[aria-checked="true"] small::before{content:"✓ "}
#langSheet .sheet-b{gap:2px}
#langSheet .lopt{padding:16px 14px;font-size:19px}
.pill{height:36px;min-width:36px;padding:0 10px;border-radius:999px;border:1.3px solid color-mix(in srgb,currentColor 30%,transparent);background:transparent;font-family:var(--f-mono);font-size:12px;font-weight:600}
.who{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.8}
.who i{width:28px;height:28px;border-radius:50%;background:var(--b1-ink);color:var(--b1);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.who span{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.who span{display:none}}

/* home bands */
.bands{display:flex;flex-direction:column;min-height:calc(100dvh - 56px - env(safe-area-inset-top,0px))}
.band{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:22px max(20px,env(safe-area-inset-left,0px)) 24px;position:relative;transition:filter .25s}
.band:active{filter:brightness(.94)}
.band:focus-visible{outline:3px solid var(--red);outline-offset:-3px}
.b-idea{background:var(--b1);color:var(--b1-ink);flex:1.5 1 0;min-height:280px}
.b-ex{background:var(--b2);color:var(--b2-ink);flex:1 1 0;min-height:190px}
.b-mine{background:var(--b1);color:var(--b1-ink);flex:1 1 0;min-height:190px}
.b-lab{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;display:flex;gap:10px}
.b-big{font-weight:500;font-size:clamp(40px,11vw,84px);line-height:.95;letter-spacing:-.045em;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.b-big b{font-weight:500;font-variant-numeric:tabular-nums;direction:ltr}
.b-big small{font-size:clamp(17px,4.4vw,26px);letter-spacing:-.01em;opacity:.7;font-weight:500}
.caret{display:inline-block;width:3px;height:.8em;background:var(--red);margin-inline-end:8px;animation:blink 1s steps(2) infinite;transform:translateY(.06em)}
@keyframes blink{50%{opacity:0}}
.b-arrow{position:absolute;top:18px;inset-inline-end:max(20px,env(safe-area-inset-right,0px));font-size:22px;opacity:.55}

.b-sub{font-size:14px;opacity:.65;max-width:34ch}
/* Phone: idea 50%, examples 25%, yours 25% of the screen */
@media (max-width:899px){
  .bands{height:calc(100dvh - 56px - env(safe-area-inset-top,0px));min-height:560px;display:grid;grid-template-rows:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}
  .bands>.band{min-height:0!important;overflow:hidden}
  .bands .b-idea{flex:2 1 0!important;min-height:0!important}
  .bands .b-ex,.bands .b-mine{flex:1 1 0!important;min-height:0!important;overflow:hidden;gap:10px;padding-top:16px}
  .b-ex .b-big,.b-mine .b-big{font-size:clamp(34px,8.5vw,60px)}
}
/* Layout B (test): idea 50%, examples 25%, yours 25% of the screen */
.lay-b .bands{height:calc(100dvh - 56px - env(safe-area-inset-top,0px));min-height:560px;flex-direction:column!important;flex-wrap:nowrap!important}
.lay-b .b-idea{flex:2 1 0!important;min-height:0!important}
.lay-b .b-ex,.lay-b .b-mine{flex:1 1 0!important;min-height:0!important;overflow:hidden;gap:10px;padding-top:16px}
.lay-b .b-ex .b-big,.lay-b .b-mine .b-big{font-size:clamp(34px,8.5vw,60px)}
.lay-b .b-ex .legend{display:none}
@media (min-width:900px){.lay-b .b-ex .legend{display:flex}}

.strip{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;overflow:hidden}
.strip i{display:block;position:relative;min-width:0;font-style:normal;transition:flex-grow 1s cubic-bezier(.2,.8,.2,1)}
.strip i::after{content:attr(data-l);position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;color:#121a1a;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
@media (hover:hover) and (pointer:fine){.strip i:hover::after{opacity:.85}}
.strip i.empty-seg{flex:1 1 0;background:#292929}
.b-ex,.b-mine{padding-bottom:44px!important;justify-content:flex-start!important}
.b-ex .b-big,.b-mine .b-big{margin-block:auto}
.tri{display:flex;height:10px;border-radius:999px;overflow:hidden;width:min(100%,420px)}
.tri i{display:block}
.legend{display:flex;gap:14px;font-family:var(--f-mono);font-size:11px;opacity:.75;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.foot{padding:18px 20px 28px;font-size:12px;color:var(--muted);text-align:center}

/* panels */
.panel{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:rise .42s var(--ease) both;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.ph{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px;padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-left,0px)) 0;background:inherit}
.back{border:0;background:transparent;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;padding:8px 6px;color:inherit}
.back .chev{font-size:22px;line-height:1;display:inline-block}

.ph-t{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.ph-r{min-width:44px;display:flex;justify-content:flex-end}

/* idea panel */
.p-idea{background:var(--b1);color:var(--b1-ink)}
.p-idea .in{display:grid;gap:18px;padding-top:12px;padding-bottom:40px}
textarea#idea{width:100%;resize:none;border:0;background:transparent;color:inherit;caret-color:var(--red);font-weight:500;font-size:clamp(30px,8vw,52px);line-height:1.1;letter-spacing:-.03em;padding:0;min-height:4.6em;overflow:hidden}
textarea#idea::placeholder{color:currentColor;opacity:.35}
textarea#idea:focus{outline:none}
.morebtn{justify-self:start;border:0;background:none;padding:4px 0;font-size:14px;font-weight:500;color:inherit;opacity:.7;text-decoration:underline;text-underline-offset:3px}
.fields{display:none;gap:10px}
.p-idea.more .fields{display:grid}
.fields label{display:grid;gap:5px;font-size:12px;opacity:.75}
.fields input{border:1.3px solid color-mix(in srgb,currentColor 25%,transparent);background:transparent;border-radius:14px;padding:13px 14px;font-size:16px;min-width:0}
.fields input:focus{outline:none;border-color:currentColor}
.fields input::placeholder{color:currentColor;opacity:.4}
.cta{height:var(--cta-h);border:0;border-radius:999px;padding:0 26px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.cta.light{background:var(--b1-ink);color:var(--b1)}
.cta.dark{background:var(--ink);color:var(--bg)}
.cta.on{background:currentColor}
.cta:disabled{opacity:.35}
.p-idea .cta{width:100%}
.note{font-size:13px;opacity:.7}
.note.err{color:var(--red);opacity:1;font-weight:600}

/* receipt panel: tone = none | night | build | pivot | kill */
.p-receipt{background:var(--night);color:var(--night-ink);transition:background-color .7s var(--ease),color .7s var(--ease)}
.p-receipt.t-build{background:var(--build);color:var(--build-ink)}
.p-receipt.t-pivot{background:var(--pivot);color:var(--pivot-ink)}
.p-receipt.t-kill{background:var(--kill);color:var(--kill-ink)}
.rc{padding-top:6px}
.rc-meta{font-family:var(--f-mono);font-size:12px;opacity:.6;display:flex;justify-content:space-between;gap:10px;direction:ltr}
[dir="rtl"] .rc-meta{flex-direction:row-reverse}
.rc-idea{font-weight:600;font-size:clamp(24px,6.4vw,38px);line-height:1.12;letter-spacing:-.025em;margin:14px 0 22px}
.c-cnt{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1.3px solid color-mix(in srgb,currentColor 35%,transparent);direction:ltr}
.rrow{border-top:1.3px solid color-mix(in srgb,currentColor 18%,transparent)}
.rrow:last-of-type{border-bottom:1.3px solid color-mix(in srgb,currentColor 18%,transparent)}
.rh{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 0;min-height:76px}
.rh:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.rn{font-family:var(--f-mono);font-size:11px;opacity:.55;align-self:start;padding-top:6px}
.rl{display:grid;gap:2px}
.rl b{font-weight:600;font-size:15px}
.rl small{font-size:12px;opacity:.6}
.rv{font-weight:500;font-size:clamp(34px,10vw,56px);line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums;direction:ltr;text-align:end;white-space:nowrap}
.rv.dim{opacity:.28}
.rv sub{font-size:.36em;letter-spacing:0;vertical-align:baseline;opacity:.7;margin-inline-start:4px}
.rrow.final .rv.word{font-family:var(--f-wide);font-weight:600;font-size:clamp(30px,9vw,56px);letter-spacing:-.01em;direction:inherit;white-space:nowrap}
.rb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.rrow.open .rb{grid-template-rows:1fr}
.rb>div{overflow:hidden}
.rbi{padding:0 0 18px;display:grid;gap:10px;font-size:14.5px;line-height:1.5}
.ln{display:flex;align-items:baseline;gap:8px}
.ln .k{font-weight:500}
.ln .fill{flex:1;border-bottom:1.3px dotted color-mix(in srgb,currentColor 35%,transparent);transform:translateY(-4px);min-width:12px}
.ln .v{font-family:var(--f-mono);font-weight:600;direction:ltr}
.ln .g{font-family:var(--f-mono);font-size:11px;font-weight:600;border:1.2px solid currentColor;border-radius:4px;padding:0 5px}
.ev{font-size:13px;opacity:.72;margin-top:-6px}
.nt b{font-weight:600}
.nt ul{margin:4px 0 0;padding-inline-start:18px}
.cav{font-size:12px;opacity:.6}
.price-in{width:84px;border:0;border-bottom:1.5px solid currentColor;background:transparent;font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:center;direction:ltr}
.price-in:focus{outline:none}
.ks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ks button{border:1.3px solid currentColor;background:transparent;border-radius:999px;padding:4px 12px;font-family:var(--f-mono);font-size:12px}
.ks button[aria-pressed="true"]{background:currentColor}
.ks button[aria-pressed="true"] span{filter:invert(1)}
.bline{font-weight:700;font-size:clamp(20px,5.4vw,26px);line-height:1.2;letter-spacing:-.02em}
.hit{animation:hit .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes hit{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hit{animation:none}}
.thanks{font-family:var(--f-mono);font-size:11px;opacity:.55;text-align:center;padding:22px 0 6px}

/* gate inside the bottom line */
.gate{display:grid;gap:12px}
.gate-t{font-weight:700;font-size:20px;line-height:1.2;letter-spacing:-.02em}
.gl{display:grid;gap:5px;font-size:12px;opacity:.85}
.gl input{border:0;background:rgba(255,255,255,.1);border-radius:14px;padding:13px 14px;font-size:16px;color:inherit;min-width:0;box-shadow:inset 0 0 0 1.3px color-mix(in srgb,currentColor 25%,transparent)}
.gl input:focus{outline:none;box-shadow:inset 0 0 0 1.6px currentColor}
.gc{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.gc input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--red)}
.gate .cta{background:var(--night-ink);color:var(--night);width:100%}
.gate .err{color:#FF7A66;font-weight:600;font-size:13px}

/* drawing (the lottery while Claude thinks) */
.draw-step{font-family:var(--f-mono);font-size:13px;display:flex;gap:8px;align-items:center;min-height:20px}
.draw-step::before{content:"▸";color:var(--red);animation:blink .8s steps(2) infinite}
.bar{height:4px;border-radius:999px;background:color-mix(in srgb,currentColor 15%,transparent);overflow:hidden;margin:12px 0 4px;direction:ltr}
[dir="rtl"] .bar{transform:scaleX(-1)}
.bar i{display:block;height:100%;width:0;background:currentColor;transition:width .5s ease-out}

/* actions + plans */
.acts{position:sticky;bottom:0;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;background:linear-gradient(to top,var(--night) 70%,transparent);z-index:3}
.p-receipt.t-build .acts{background:linear-gradient(to top,var(--build) 70%,transparent)}
.p-receipt.t-pivot .acts{background:linear-gradient(to top,var(--pivot) 70%,transparent)}
.p-receipt.t-kill .acts{background:linear-gradient(to top,var(--kill) 70%,transparent)}
.acts-row{display:flex;gap:8px}
.acts-row .cta{flex:1}
.btn-main{background:currentColor}
.btn-main span{filter:invert(1);mix-blend-mode:normal}
.p-receipt .btn-main{background:var(--night-ink);color:var(--night)}
.p-receipt.t-build .btn-main{background:var(--build-ink);color:var(--build)}
.p-receipt.t-pivot .btn-main{background:var(--pivot-ink);color:var(--pivot)}
.p-receipt.t-kill .btn-main{background:var(--kill-ink);color:var(--kill)}
.btn-ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.4px color-mix(in srgb,currentColor 40%,transparent)}
.btn-ai{background:color-mix(in srgb,#7C6CFF 16%,transparent);box-shadow:inset 0 0 0 1.4px color-mix(in srgb,#7C6CFF 65%,transparent);color:#7C6CFF}
.acts .note{text-align:center}
.plans{display:grid;gap:10px;padding:8px 0 28px}
.plans-t{font-weight:700;font-size:20px;letter-spacing:-.02em}
.plans-s{font-size:13.5px;opacity:.75;margin-top:-4px}
.plan{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:14px 0;border-top:1.3px solid color-mix(in srgb,currentColor 18%,transparent)}
.plan b{font-weight:600}
.plan .pp{font-family:var(--f-mono);font-weight:600;font-size:18px;direction:ltr}
.plan button{border:1.4px solid currentColor;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.plan button[aria-pressed="true"]{background:currentColor}
.plan button[aria-pressed="true"] span{filter:invert(1)}

/* examples panel */
.p-ex{background:var(--b2);color:var(--b2-ink)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px max(20px,env(safe-area-inset-left,0px)) 28px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.xc{scroll-snap-align:center;flex:0 0 min(86vw,400px);min-height:min(68dvh,560px);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;overflow:hidden;isolation:isolate}
.xc.build{background:var(--build);color:var(--build-ink)}
.xc.pivot{background:var(--pivot);color:var(--pivot-ink)}
.xc.kill{background:var(--kill);color:var(--kill-ink)}
.xc .cat{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.xc h3{margin:6px 0 0;font-weight:600;font-size:clamp(28px,7.4vw,40px);line-height:1.05;letter-spacing:-.035em}
.xc p{margin:0;font-size:15px;line-height:1.45;opacity:.85}
.xc .xw{margin-top:auto;font-family:var(--f-wide);font-weight:600;font-size:clamp(34px,10vw,52px);line-height:1;white-space:nowrap}
.xc{cursor:pointer;-webkit-tap-highlight-color:transparent}
.xc:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.xc:active .cta{transform:scale(.97)}
.xc .cta{background:currentColor;align-self:stretch}
.xc .cta span{filter:invert(1)}
.xc.build .cta{background:var(--build-ink);color:var(--build)} .xc.pivot .cta{background:var(--pivot-ink);color:var(--pivot)} .xc.kill .cta{background:var(--kill-ink);color:var(--kill)}
.xc .cta span{filter:none}
.ex-intro{padding:4px 0 14px;font-size:15px;opacity:.75;max-width:40ch}

/* mine panel */

function wrapLines(x,str,maxW,maxLines){
  const words=String(str||"").split(/\s+/).filter(Boolean), out=[]; let line="";
  for (const w of words){ const tryL=line?line+" "+w:w; if (x.measureText(tryL).width<=maxW || !line) line=tryL; else { out.push(line); line=w; } }
  if (line) out.push(line);
  if (out.length>maxLines){ const keep=out.slice(0,maxLines); let last=keep[maxLines-1]; while(last && x.measureText(last+"…").width>maxW) last=last.slice(0,-1); keep[maxLines-1]=last.trim()+"…"; return keep; }
  return out;
}

  const rule=(py)=>{ x.save(); x.globalAlpha=.25; x.strokeStyle=FG; x.lineWidth=2; x.beginPath(); x.moveTo(IL,py); x.lineTo(IR,py); x.stroke(); x.restore(); };
  const seed=o.id||b.idea, d=o.date?new Date(o.date):new Date();
  const dt=new Intl.DateTimeFormat(LOC[S.lang],{day:"2-digit",month:"2-digit",year:"numeric"}).format(d);
  let y=128;
  txt("WAZO",'700 44px '+SANS,FG,S0,y);
  x.save(); x.direction="ltr"; x.globalAlpha=.6; txt(`#${receiptNo(seed)} · ${dt}`,'500 24px '+MONO,FG,E0,y,rtl?"left":"right"); x.restore();
  y+=92;
  const ttl=ideaTitle(b); let tf=76; x.font=`700 ${tf}px ${WIDE}`; while(x.measureText(ttl).width>IW && tf>44){ tf-=4; x.font=`700 ${tf}px ${WIDE}`; }
  wrapLines(x,ttl,IW,1).forEach(l=>{ txt(l,`700 ${tf}px ${WIDE}`,FG,S0,y+8); }); y+=72;
  x.save(); x.globalAlpha=.78; x.font='500 34px '+SANS; wrapLines(x,b.idea,IW,2).forEach(l=>{ txt(l,'500 34px '+SANS,FG,S0,y); y+=46; }); x.restore();
  y+=18; rule(y); y+=72;
  b.scores.forEach(sc=>{
    txt(L.sc[sc.key],'500 34px '+SANS,FG,S0,y);
    x.save(); x.direction="ltr"; txt(`${sc.score}`,'500 64px '+SANS,FG,E0-s*70,y+6,rtl?"left":"right");
    x.globalAlpha=.7; txt(sc.grade,'600 26px '+MONO,FG,E0,y,rtl?"left":"right"); x.restore();
    y+=24; rule(y); y+=64;
  });
  y+=40;
  const word=L.vWord[b.verdict]; let fs=150; x.font=`600 ${fs}px ${WIDE}`; while(x.measureText(word).width>IW && fs>60){ fs-=8; x.font=`600 ${fs}px ${WIDE}`; }
  txt(word,`600 ${fs}px ${WIDE}`,FG,S0,y+fs*.75); y+=fs*.75+88;
  x.font='700 38px '+SANS; wrapLines(x,b.headline,IW,3).forEach(l=>{ txt(l,'700 38px '+SANS,FG,S0,y); y+=50; });
  x.save(); x.globalAlpha=.65; txt(t("imgFoot"),'500 24px '+MONO,FG,W/2,H-64,"center"); x.restore();
  return c;
}
async function saveImage(b,o,btn){
  btn.disabled=true; const say=m=>{ const n=$("#actNote"); if(n) n.textContent=m; }; say(t("imgMaking"));
  try{
    const canvas=await receiptImage(b,o);
    const blob=await new Promise((res,rej)=>canvas.toBlob(bl=>bl?res(bl):rej(new Error("blob")),"image/png"));
    const name=`wazo-${fileSlug(ideaTitle(b))}-${b.verdict.toLowerCase()}.png`;
    if (window.claude && window.claude.use){
      const dl=await claude.use("downloads");
      if (dl){ try{ await dl.save({filename:name,data:blob}); say(t("imgSaved")); }catch(e){ say(e&&e.code==="declined"?"":t("imgFail")); } return; }
    }
    const file=new File([blob],name,{type:"image/png"});
    if (matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); say(""); return; }catch(e){ if(e&&e.name==="AbortError"){ say(""); return; } }
    }
    const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); say(t("imgSaved"));
  } catch(e){ say(t("imgFail")); }
  finally{ btn.disabled=false; }
}

/* ---------- the draw (while Claude thinks) ---------- */
const VERD=["BUILD","PIVOT","KILL"], STEP_AT=[0,14,30,48,66,84];
function printing(idea){
  const L=T[S.lang], keys=["pain","demand","space","pay"];
  $("#p-receipt").classList.remove("t-build","t-pivot","t-kill"); $("#cntBox").innerHTML="";
  $("#stage")._b=null;
  $("#stage").innerHTML=`<article class="rc">
    <div class="rc-meta"><span>WAZO</span><span id="dPct">0%</span></div>
    <h2 class="rc-idea">${esc(idea)}</h2>
    <div class="draw-step" id="dStep">${esc(L.steps[0])}</div>
    <div class="bar"><i id="dBar"></i></div>
    ${keys.map((k,i)=>`<section class="rrow"><div class="rh"><span class="rn">0${i+1}</span><span class="rl"><b>${esc(L.sc[k])}</b></span><span class="rv d-roll">?</span></div></section>`).join("")}
    <section class="rrow final"><div class="rh"><span class="rn">05</span><span class="rl"><b>${esc(t("rowsTotal"))}</b></span><span class="rv word" id="dReel">${esc(L.vWord.PIVOT)}</span></div></section>
  </article>`;
  $("#cardacts").innerHTML=`<button type="button" class="cta btn-ghost" data-act="stop">${esc(t("stop"))}</button>`;
  const pb=$("#plansBox"); if(pb) pb.remove();
  const t0=performance.now(); let tick=0, vi=0;
  const frame=()=>{
    const sec=(performance.now()-t0)/1000, pct=Math.round(92*(1-Math.exp(-sec/20)));
    const bar=$("#dBar"); if(!bar) return;
    bar.style.width=pct+"%"; $("#dPct").textContent=pct+"%";
    const at=STEP_AT.filter(x=>pct>=x).length-1; $("#dStep").textContent=L.steps[Math.max(0,at)];
    if (!calm()){ tick++;
      document.querySelectorAll(".d-roll").forEach(el=>{ el.textContent=1+Math.floor(Math.random()*10); });
      if (tick%2===0){ vi=(vi+1)%3; $("#dReel").textContent=T[S.lang].vWord[VERD[vi]]; } }
  };
  frame(); S.timer=setInterval(frame,110);
}
function land(b){
  clearInterval(S.timer);
  return new Promise(res=>{
    if (!$("#dBar")) return res();
    $("#dBar").style.width="100%"; $("#dPct").textContent="100%";
    document.querySelectorAll(".d-roll").forEach((el,i)=>{ el.textContent=b.scores[i]?.score??"?"; });
    $("#dReel").textContent="?";
    setTimeout(res, calm()?250:1100);
  });
}

/* ---------- verdict ---------- */
const errCopy=c=>({bot:t("errBot"),busy:t("errBusy"),limit:t("errLimit"),limit_anon:t("errLimitAnon"),need_pro:t("errNeedPro"),not_configured:t("errSetup"),timeout:t("errTimeout"),invalid_json:t("errJson"),refused:t("errRefused"),bad_email:t("gBad"),need_idea:t("needIdea")}[c]||t("errGeneric"));
async function api(path,payload,signal){
  const r=await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal});
  let data={}; try{ data=await r.json(); }catch(e){} return {status:r.status,data};
}
const track=(name,data)=>{ try{ window.umami&&window.umami.track(name,data); }catch(e){} };
const TS={id:null,cb:null};
function humanToken(){
  if (!S.cfg.siteKey || !window.turnstile) return Promise.resolve("");
  return new Promise(res=>{
    let fin=false; const done=v=>{ if(fin) return; fin=true; clearTimeout(to); res(v||""); }; const to=setTimeout(()=>done(""),20000); TS.cb=done;
    try{
      if (TS.id===null) TS.id=turnstile.render("#ts",{sitekey:S.cfg.siteKey,execution:"execute",appearance:"interaction-only",callback:v=>TS.cb&&TS.cb(v),"error-callback":()=>TS.cb&&TS.cb(""),"timeout-callback":()=>TS.cb&&TS.cb("")});
      else turnstile.reset(TS.id);
      turnstile.execute(TS.id);
    }catch(e){ done(""); }
  });
}
function showIdeaPlans(){ $("#ideaPlans")?.remove(); $("#askNote").insertAdjacentHTML("afterend",`<div id="ideaPlans">${plansHTML()}</div>`); }
async function runVerdict(){
  const idea=$("#idea").value.trim();
  if (!idea){ setNote(t("needIdea"),true); go("idea"); $("#idea").focus(); return; }
  if (S.busy) return;
  $("#ideaPlans")?.remove();
  S.busy=true; S.ctl=new AbortController(); $("#goBtn").disabled=true; setNote("");
  const token=await humanToken();
  go("receipt"); printing(idea);
  try {
    const r=await api("analyze",{idea,cust:$("#fCust").value.trim(),budget:$("#fBudget").value.trim(),time:$("#fTime").value.trim(),lang:S.lang,token,email:S.me.email||""},S.ctl.signal);
    if (r.status!==200) throw {code:(r.data&&r.data.code)||"error"};
    const b=norm({...(r.data.wazo||{}),cur:CUR()}); b.full=!!r.data.full; b.sid=r.data.id; if(!b.idea) b.idea=idea;
    S.current=b; S.isExample=false; S.currentId=null; S.savedNote="";
    save(b,idea); await land(b); track("analyze",{lang:S.lang,full:b.full});
    S.busy=false; S.rev=new Set(); S.open=0; S.stampHit=false; renderStage(); $("#p-receipt").scrollTop=0;
  } catch(e){
    S.busy=false; clearInterval(S.timer);
    go("idea");
    if (!(e && e.name==="AbortError")) setNote(errCopy(e&&e.code),true);
    if (e && e.code==="need_pro") showIdeaPlans();
  } finally { clearInterval(S.timer); S.busy=false; $("#goBtn").disabled=false; }
}
$("#moreBtn").addEventListener("click", ()=>{ const p=$("#p-idea"), on=!p.classList.contains("more"); p.classList.toggle("more",on); $("#moreBtn").setAttribute("aria-expanded",on); if(on) $("#fCust").focus(); });
$("#askForm").addEventListener("submit", e=>{ e.preventDefault(); runVerdict(); });
$("#idea").addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); runVerdict(); } });
(()=>{ let i=0, txt="", pos=0, dir=1, hold=0;
  const tick=()=>{ const ta=$("#idea");
    if (S.view==="idea" && !ta.value && !calm()){
      const list=FEED.map(f=>f.idea[S.lang]); if(!txt) txt=list[i%list.length];
      if (hold>0){ hold--; }
      else if (dir>0){ pos++; if(pos>=txt.length){ dir=-1; hold=40; } }
      else { pos-=3; if(pos<=0){ pos=0; dir=1; i++; txt=list[i%list.length]; hold=6; } }
      ta.placeholder=txt.slice(0,pos)+(dir>0||hold?"":"");
    } else if (!ta.value) { ta.placeholder=t("ideaPh"); txt=""; pos=0; dir=1; }
    setTimeout(tick, dir>0?38:18);
  };
  setTimeout(tick, 600);
})();
function fitIdea(){
  const ta=$("#idea"); ta.style.height="auto"; ta.style.height=Math.max(ta.scrollHeight, 120)+"px";
}
$("#idea").addEventListener("input", fitIdea);

/* ---------- examples rail ---------- */
function renderRail(){
  const L=T[S.lang];
  $("#rail").innerHTML=FEED.map((f,i)=>{const x=f[S.lang]; return `<article class="xc ${VCLS(f.v)}" data-feed="${i}" role="button" tabindex="0" aria-label="${esc(x.t)}">
    <span class="cat">${esc(x.cat)}</span><h3>${esc(x.t)}</h3><p>${esc(x.l)}</p>
    <span class="xw">${esc(L.vWord[f.v])}</span>
    <button class="cta" type="button" tabindex="-1"><span>${esc(t("tryIdea"))}</span>${ic("arrow")}</button></article>`;}).join("");
}
function updExCount(){
  const r=$("#rail"), w=r.firstElementChild?.getBoundingClientRect().width||1;
  const i=Math.min(FEED.length-1, Math.round(Math.abs(r.scrollLeft)/(w+12)));
  $("#exCount").textContent=String(i+1).padStart(2,"0")+"/"+String(FEED.length).padStart(2,"0");
}
$("#rail").addEventListener("scroll", ()=>requestAnimationFrame(()=>{ updExCount(); railFx(); }), {passive:true});
$("#rail").addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches(".xc")){ e.preventDefault(); e.target.click(); } });
$("#rail").addEventListener("click", e=>{ const b=e.target.closest("[data-feed]"); if(!b) return; const ta=$("#idea"); ta.value=FEED[+b.dataset.feed].idea[S.lang]; ta.dispatchEvent(new Event("input",{bubbles:true}));
  go("idea"); setTimeout(()=>{ try{ ta.focus({preventScroll:true}); ta.setSelectionRange(ta.value.length,ta.value.length); }catch(_){} },450); });

/* ---------- yours (db) ---------- */
const MINE_KEY="wz.mine";
function persistMine(){ try{ localStorage.setItem(MINE_KEY, JSON.stringify(S.mine.slice(0,100))); }catch(e){} }
function save(b,raw){
  const id=b.sid||("l"+Date.now());
  const doc={id,idea:b.idea,input:raw,lang:S.lang,verdict:b.full?b.verdict:"",brief:b,killStatus:"pending",createdAt:new Date().toISOString()};
  S.mine=[doc,...S.mine.filter(x=>x.id!==id)]; S.currentId=id; S.savedNote=t("saved"); persistMine(); renderHome();
}
function updateMine(b){ const it=S.mine.find(x=>x.id===b.sid); if(it){ it.brief=b; it.verdict=b.verdict; it.idea=b.idea; persistMine(); renderDrawer(); renderHome(); } }
function setKill(id,status){
  const it=S.mine.find(x=>x.id===id); if(!it) return;
  it.killStatus=status; persistMine(); const st=$("#stage"); st.innerHTML=cardHTML(st._b,currentCard().o);
}
function loadDrawer(){
  try{ const v=JSON.parse(localStorage.getItem(MINE_KEY)||"[]"); S.mine=Array.isArray(v)?v:[]; }catch(e){ S.mine=[]; }
  S.mineLoaded=true; renderDrawer(); renderHome();
}
function renderDrawer(){
  const box=$("#drawerList");
  if (!S.ready){ box.innerHTML=`<div class="empty"><span>${esc(t("loading"))}</span></div>`; return; }
  if (!S.mineLoaded && !S.mine.length){ box.innerHTML=`<div class="empty"><span>${esc(t("loading"))}</span></div>`; return; }
  if (!S.mine.length){ box.classList.remove("rail"); box.innerHTML=`<div class="empty"><b>${esc(t("drEmpty"))}</b><span>${esc(t("drEmptyS"))}</span><button class="cta dark" type="button" data-go="idea">${esc(t("navCta"))}</button></div>`; return; }
  const L=T[S.lang], df=new Intl.DateTimeFormat(LOC[S.lang],{day:"numeric",month:"short"});
  box.classList.add("rail");
  box.innerHTML=S.mine.map((m,k)=>{const ks=m.killStatus||"pending", c=S.confirmDel===m.id, b=m.brief||{}, full=!!m.verdict;
    const date=m.createdAt?df.format(new Date(m.createdAt)):"", status=ks==="pass"?L.r.ksY:ks==="fail"?L.r.ksN:L.r.ksP;
    return `<article class="xc ${full?VCLS(m.verdict):"lockd"}" data-row="${esc(m.id)}" role="button" tabindex="0" aria-label="${esc(b.title||m.idea)}">
    <span class="cat">${esc(date)} · ${esc(L.r.ks)}: ${esc(status)}</span><h3>${esc(b.title||m.idea)}</h3><p>${esc(full?(b.headline||m.idea):m.idea)}</p>
    <span class="xw">${full?esc(L.vWord[m.verdict]||""):ic("lock")}</span>
    <button class="cta" type="button" tabindex="-1"><span>${esc(t("open"))}</span>${ic("arrow")}</button>
    <button class="mdel" type="button" data-d="${esc(m.id)}" aria-label="${esc(c?t("sure"):t("del"))}" title="${esc(c?t("sure"):t("del"))}">${ic("trash",c?"arm":"")}</button></article>`;}).join("");
}
$("#drawerList").addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches(".xc")){ e.preventDefault(); e.target.click(); } });
$("#drawerList").addEventListener("click", async e=>{
  const d=e.target.closest("[data-d]"), row=e.target.closest("[data-row]");
  if (d){ const id=d.dataset.d; if (S.confirmDel===id){ S.confirmDel=null; S.mine=S.mine.filter(x=>x.id!==id); if(S.currentId===id) S.currentId=null; persistMine(); renderDrawer(); renderHome(); } else { S.confirmDel=id; renderDrawer(); } return; }
  if (row){ const m=S.mine.find(x=>x.id===row.dataset.row); if(!m) return; const nb=norm(m.brief||{}); nb.full=!!(m.brief&&m.brief.full); nb.sid=m.brief&&m.brief.sid; S.current=nb; S.currentId=m.id; S.isExample=false; S.savedNote=""; if(nb.full){ S.rev=new Set([1,2,3,4,5]); S.open=5; S.stampHit=true; } else { S.rev=new Set([1,2]); S.open=0; S.stampHit=false; } go("receipt"); renderStage(); }
});

/* ---------- language / theme / boot ---------- */
function applyLang(){
  const app=$("#app"); app.dir=S.lang==="he"?"rtl":"ltr"; app.lang=S.lang; document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("#h1").innerHTML=t("h1");
  $("#idea").placeholder=t("ideaPh"); $("#fCust").placeholder=t("phCust"); $("#fBudget").placeholder=t("phBudget"); $("#fTime").placeholder=t("phTime");
  $("#langBtn").textContent=(LANGS.find(x=>x[0]===S.lang)||LANGS[0])[2];
  let thUser=null; try{ thUser=localStorage.getItem("wz.theme"); }catch(e){}
  if (!thUser){ if (S.lang==="en") document.documentElement.setAttribute("data-theme","dark"); else document.documentElement.removeAttribute("data-theme"); }
  if (S.ready && !S.cfg.ready) setNote(t("errSetup"));
  renderHome(); renderRail(); renderDrawer(); if (S.current && !S.busy) renderStage();
}
function renderLegal(){
  $("#legalBody").innerHTML=`<p class="lead">${esc(t("legalLead"))}</p>`+t("legal").map(([h,p])=>`<section><h3>${esc(h)}</h3><p>${esc(p)}</p></section>`).join("")
    +`<div style="display:grid;gap:8px">${S.me.email?"":`<label class="gl"><span>${esc(t("gEmail"))}</span><input id="delEmail" type="email" autocomplete="email" inputmode="email"></label>`}<button class="cta light" type="button" id="delBtn">${esc(t("delReq"))}</button><span class="note" id="delNote"></span></div><p class="upd">${esc(t("legalUpd"))}</p>`;
  $("#delBtn").addEventListener("click", async ()=>{
    const n=$("#delNote"), btn=$("#delBtn");

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ n.textContent=t("delNo"); $("#delEmail")?.focus(); return; }
    btn.disabled=true;
    try{ const token=await humanToken(); const r=await api("lead",{action:"delete",email,token}); if(r.status!==200) throw 0; n.textContent=t("delSent"); S.me={name:"",email:""}; try{ localStorage.removeItem("wz.email"); localStorage.removeItem("wz.name"); }catch(e){} }
    catch(e){ btn.disabled=false; n.textContent=t("errGeneric"); }
  });
}
$("#legalBtn").addEventListener("click",()=>{ renderLegal(); const d=$("#legal"); d.dir=S.lang==="he"?"rtl":"ltr"; if(d.showModal) d.showModal(); else d.setAttribute("open",""); });
$("#legalX").addEventListener("click",()=>$("#legal").close());
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));
$("#teams").addEventListener("click",e=>{ if(e.target===e.currentTarget) e.currentTarget.close(); });
function setPro(on){ S.pro=!!on; const b=$("#proBtn"); b.textContent=S.pro?"PRO":"FREE"; b.setAttribute("aria-pressed",S.pro); try{ localStorage.setItem("wz.pro",S.pro?"1":"0"); }catch(e){} if (S.current && !S.busy) renderStage(); }
function enablePreview(){ $("#proBtn").hidden=false; setPro(S.proPreview); }
$("#proBtn").addEventListener("click",()=>setPro(!S.pro));
$("#legal").addEventListener("click",e=>{ if(e.target===e.currentTarget) e.currentTarget.close(); });
const langOpts=()=>LANGS.map(([k,name,code])=>`<button class="lopt" type="button" role="menuitemradio" data-lang="${k}" aria-checked="${k===S.lang}" lang="${k}" dir="${k==="he"?"rtl":"ltr"}"><span>${name}</span><small>${code}</small></button>`).join("");
const isSheet=()=>matchMedia("(max-width:699px)").matches;
function closeLangMenu(){ const m=$("#langMenu"); if(!m.hidden){ m.hidden=true; $("#langBtn").setAttribute("aria-expanded","false"); } }
function setLang(k){ if(!LANGS.some(x=>x[0]===k)) return; closeLangMenu(); const d=$("#langSheet"); if(d.open) d.close(); if(k===S.lang) return; S.lang=k; try{localStorage.setItem("wz.lang",k)}catch(e){} applyLang(); }
$("#langBtn").addEventListener("click",e=>{ e.stopPropagation();
  if (isSheet()){ $("#langList").innerHTML=langOpts(); const d=$("#langSheet"); d.dir=S.lang==="he"?"rtl":"ltr"; $("#langTitle").textContent=t("langT"); if(d.showModal) d.showModal(); else d.setAttribute("open",""); return; }
  const m=$("#langMenu"); if(!m.hidden){ closeLangMenu(); return; } m.innerHTML=langOpts(); m.hidden=false; $("#langBtn").setAttribute("aria-expanded","true"); m.querySelector('[aria-checked="true"]')?.focus({preventScroll:true}); });
$("#langMenu").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(b) setLang(b.dataset.lang); });
$("#langList").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(b) setLang(b.dataset.lang); });
$("#langSheet").addEventListener("click",e=>{ if(e.target===e.currentTarget) e.currentTarget.close(); });
document.addEventListener("click",e=>{ if(!e.target.closest("#langMenu")) closeLangMenu(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeLangMenu(); } });
$("#themeBtn").addEventListener("click",()=>{ const m=$("#themeBtn .ic"); if(m){ m.classList.remove("spin"); void m.getBoundingClientRect(); m.classList.add("spin"); } const root=document.documentElement, cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); const next=cur==="dark"?"light":"dark"; root.setAttribute("data-theme",next); try{localStorage.setItem("wz.theme",next)}catch(e){} });

hydrateIcons(); applyLang();
["#rail","#stage","#drawerList"].forEach(sel=>{ const n=document.querySelector(sel); if(n) new MutationObserver(fitSoon).observe(n,{childList:true,subtree:true}); });
fitSoon();
if (location.hash==="#demo"){ S.current=norm({...EXAMPLE[S.lang],cur:CUR()}); S.current.full=false; S.isExample=false; history.replaceState(null,"","#receipt"); enablePreview(); }
show(location.hash.slice(1)); if (S.current) renderStage();
loadDrawer();
(async()=>{
  try{ const r=await fetch("/api/config",{cache:"no-store"}); if(r.ok) S.cfg={...S.cfg,...(await r.json())}; }catch(e){}
  S.ready=true; renderDrawer();
  const add=(src,attrs)=>{ const sc=document.createElement("script"); sc.src=src; sc.async=true; sc.defer=true; Object.entries(attrs||{}).forEach(([k,v])=>sc.setAttribute(k,v)); document.head.appendChild(sc); };
  if (S.cfg.siteKey) add("https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit");
  if (S.cfg.umami) add("https://cloud.umami.is/script.js",{"data-website-id":S.cfg.umami});
  if (!S.cfg.ready) setNote(t("errSetup"));
})();
})();
