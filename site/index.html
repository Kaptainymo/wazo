<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wazo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;600&family=Miriam+Libre:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Mobile-first, Currency-style: the home screen is three full-bleed bands (your idea, examples, yours).
   Tap a band and it opens full screen. A receipt is a stack of big-type rows; when the verdict is
   revealed the whole sheet floods with the verdict color: BUILD green, PIVOT amber, KILL red. */
:root{
  --bg:#F6F5F2; --ink:#111; --muted:#77756F; --line:#D9D8D3; --red:#E5412B;
  --b1:#111111; --b1-ink:#F4F3EF; --b2:#E6E5E0; --b2-ink:#111; --b3:#F6F5F2; --b3-ink:#111;
  --night:#161616; --night-ink:#F4F3EF;
  --build:#2DB46C; --build-ink:#0B2416; --pivot:#F6B73C; --pivot-ink:#2A1C00; --kill:#E5412B; --kill-ink:#FFFFFF;
  --cta-h:52px;
  --f-sans:"Hanken Grotesk","IBM Plex Sans Hebrew","Segoe UI",system-ui,sans-serif;
  --f-wide:"Unbounded","Miriam Libre","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","IBM Plex Sans Hebrew",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --ink:#F1F0EC; --muted:#8E8C87; --line:#2A2A2A;
  --b1:#000; --b1-ink:#F4F3EF; --b2:#1C1C1C; --b2-ink:#F1F0EC; --b3:#0E0E0E; --b3-ink:#F1F0EC; --night:#0A0A0A; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E0E; --ink:#F1F0EC; --muted:#8E8C87; --line:#2A2A2A;
  --b1:#000; --b1-ink:#F4F3EF; --b2:#1C1C1C; --b2-ink:#F1F0EC; --b3:#0E0E0E; --b3-ink:#F1F0EC; --night:#0A0A0A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
html.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.in{width:100%;max-width:680px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left,0px))}

/* nav */
nav.top{position:sticky;top:0;z-index:20;background:var(--b1);color:var(--b1-ink);padding-top:env(safe-area-inset-top,0px)}
nav.top .in{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:none}
.brand{font-weight:700;font-size:19px;letter-spacing:-.02em;direction:ltr;text-decoration:none;color:inherit;display:flex;gap:2px;align-items:flex-start}
.brand sup{font-size:9px;margin-top:3px}
.navr{display:flex;gap:6px;align-items:center}
.pill{height:36px;min-width:36px;padding:0 10px;border-radius:999px;border:1.3px solid color-mix(in srgb,currentColor 30%,transparent);background:transparent;font-family:var(--f-mono);font-size:12px;font-weight:600}
.who{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.8}
.who i{width:28px;height:28px;border-radius:50%;background:var(--b1-ink);color:var(--b1);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.who span{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.who span{display:none}}

/* home bands */
.bands{display:flex;flex-direction:column;min-height:calc(100dvh - 56px - env(safe-area-inset-top,0px))}
.band{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:22px max(20px,env(safe-area-inset-left,0px)) 24px;position:relative;transition:filter .25s}
.band:active{filter:brightness(.94)}
.band:focus-visible{outline:3px solid var(--red);outline-offset:-3px}
.b-idea{background:var(--b1);color:var(--b1-ink);flex:1.5 1 0;min-height:280px}
.b-ex{background:var(--b2);color:var(--b2-ink);flex:1 1 0;min-height:190px}
.b-mine{background:var(--b3);color:var(--b3-ink);flex:1 1 0;min-height:190px;border-top:1px solid var(--line)}
.b-lab{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;display:flex;gap:10px}
.b-big{font-weight:500;font-size:clamp(40px,11vw,84px);line-height:.95;letter-spacing:-.045em;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.b-big b{font-weight:500;font-variant-numeric:tabular-nums;direction:ltr}
.b-big small{font-size:clamp(17px,4.4vw,26px);letter-spacing:-.01em;opacity:.7;font-weight:500}
.caret{display:inline-block;width:3px;height:.8em;background:var(--red);margin-inline-start:6px;animation:blink 1s steps(2) infinite;transform:translateY(.06em)}
@keyframes blink{50%{opacity:0}}
.b-arrow{position:absolute;top:18px;inset-inline-end:max(20px,env(safe-area-inset-right,0px));font-size:22px;opacity:.55}

.b-sub{font-size:14px;opacity:.65;max-width:34ch}
.tri{display:flex;height:10px;border-radius:999px;overflow:hidden;width:min(100%,420px)}
.tri i{display:block}
.legend{display:flex;gap:14px;font-family:var(--f-mono);font-size:11px;opacity:.75;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.foot{padding:18px 20px 28px;font-size:12px;color:var(--muted);text-align:center}

/* panels */
.panel{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:rise .42s var(--ease) both;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.ph{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px;padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-left,0px)) 0;background:inherit}
.back{border:0;background:transparent;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;padding:8px 6px;color:inherit}
.back .chev{font-size:22px;line-height:1;display:inline-block}

.ph-t{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.ph-r{min-width:44px;display:flex;justify-content:flex-end}

/* idea panel */
.p-idea{background:var(--b1);color:var(--b1-ink)}
.p-idea .in{display:grid;gap:18px;padding-top:12px;padding-bottom:40px}
textarea#idea{width:100%;resize:none;border:0;background:transparent;color:inherit;caret-color:var(--red);font-weight:500;font-size:clamp(30px,8vw,52px);line-height:1.1;letter-spacing:-.03em;padding:0;min-height:4.6em;overflow:hidden}
textarea#idea::placeholder{color:currentColor;opacity:.35}
textarea#idea:focus{outline:none}
.morebtn{justify-self:start;border:0;background:none;padding:4px 0;font-size:14px;font-weight:500;color:inherit;opacity:.7;text-decoration:underline;text-underline-offset:3px}
.fields{display:none;gap:10px}
.p-idea.more .fields{display:grid}
.fields label{display:grid;gap:5px;font-size:12px;opacity:.75}
.fields input{border:1.3px solid color-mix(in srgb,currentColor 25%,transparent);background:transparent;border-radius:14px;padding:13px 14px;font-size:16px;min-width:0}
.fields input:focus{outline:none;border-color:currentColor}
.fields input::placeholder{color:currentColor;opacity:.4}
.cta{height:var(--cta-h);border:0;border-radius:999px;padding:0 26px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.cta.light{background:var(--b1-ink);color:var(--b1)}
.cta.dark{background:var(--ink);color:var(--bg)}
.cta.on{background:currentColor}
.cta:disabled{opacity:.35}
.p-idea .cta{width:100%}
.note{font-size:13px;opacity:.7}
.note.err{color:var(--red);opacity:1;font-weight:600}

/* receipt panel: tone = none | night | build | pivot | kill */
.p-receipt{background:var(--night);color:var(--night-ink);transition:background-color .7s var(--ease),color .7s var(--ease)}
.p-receipt.t-build{background:var(--build);color:var(--build-ink)}
.p-receipt.t-pivot{background:var(--pivot);color:var(--pivot-ink)}
.p-receipt.t-kill{background:var(--kill);color:var(--kill-ink)}
.rc{padding-top:6px}
.rc-meta{font-family:var(--f-mono);font-size:12px;opacity:.6;display:flex;justify-content:space-between;gap:10px;direction:ltr}
[dir="rtl"] .rc-meta{flex-direction:row-reverse}
.rc-idea{font-weight:600;font-size:clamp(24px,6.4vw,38px);line-height:1.12;letter-spacing:-.025em;margin:14px 0 22px}
.c-cnt{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1.3px solid color-mix(in srgb,currentColor 35%,transparent);direction:ltr}
.rrow{border-top:1.3px solid color-mix(in srgb,currentColor 18%,transparent)}
.rrow:last-of-type{border-bottom:1.3px solid color-mix(in srgb,currentColor 18%,transparent)}
.rh{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 0;min-height:76px}
.rh:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.rn{font-family:var(--f-mono);font-size:11px;opacity:.55;align-self:start;padding-top:6px}
.rl{display:grid;gap:2px}
.rl b{font-weight:600;font-size:15px}
.rl small{font-size:12px;opacity:.6}
.rv{font-weight:500;font-size:clamp(34px,10vw,56px);line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums;direction:ltr;text-align:end;white-space:nowrap}
.rv.dim{opacity:.28}
.rv sub{font-size:.36em;letter-spacing:0;vertical-align:baseline;opacity:.7;margin-inline-start:4px}
.rrow.final .rv.word{font-family:var(--f-wide);font-weight:600;font-size:clamp(30px,9vw,56px);letter-spacing:-.01em;direction:inherit}
.rb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.rrow.open .rb{grid-template-rows:1fr}
.rb>div{overflow:hidden}
.rbi{padding:0 0 18px;display:grid;gap:10px;font-size:14.5px;line-height:1.5}
.ln{display:flex;align-items:baseline;gap:8px}
.ln .k{font-weight:500}
.ln .fill{flex:1;border-bottom:1.3px dotted color-mix(in srgb,currentColor 35%,transparent);transform:translateY(-4px);min-width:12px}
.ln .v{font-family:var(--f-mono);font-weight:600;direction:ltr}
.ln .g{font-family:var(--f-mono);font-size:11px;font-weight:600;border:1.2px solid currentColor;border-radius:4px;padding:0 5px}
.ev{font-size:13px;opacity:.72;margin-top:-6px}
.nt b{font-weight:600}
.nt ul{margin:4px 0 0;padding-inline-start:18px}
.cav{font-size:12px;opacity:.6}
.price-in{width:84px;border:0;border-bottom:1.5px solid currentColor;background:transparent;font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:center;direction:ltr}
.price-in:focus{outline:none}
.ks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ks button{border:1.3px solid currentColor;background:transparent;border-radius:999px;padding:4px 12px;font-family:var(--f-mono);font-size:12px}
.ks button[aria-pressed="true"]{background:currentColor}
.ks button[aria-pressed="true"] span{filter:invert(1)}
.bline{font-weight:700;font-size:clamp(20px,5.4vw,26px);line-height:1.2;letter-spacing:-.02em}
.hit{animation:hit .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes hit{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hit{animation:none}}
.thanks{font-family:var(--f-mono);font-size:11px;opacity:.55;text-align:center;padding:22px 0 6px}

/* gate inside the bottom line */
.gate{display:grid;gap:12px}
.gate-t{font-weight:700;font-size:20px;line-height:1.2;letter-spacing:-.02em}
.gl{display:grid;gap:5px;font-size:12px;opacity:.85}
.gl input{border:0;background:rgba(255,255,255,.1);border-radius:14px;padding:13px 14px;font-size:16px;color:inherit;min-width:0;box-shadow:inset 0 0 0 1.3px color-mix(in srgb,currentColor 25%,transparent)}
.gl input:focus{outline:none;box-shadow:inset 0 0 0 1.6px currentColor}
.gc{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.gc input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--red)}
.gate .cta{background:var(--night-ink);color:var(--night);width:100%}
.gate .err{color:#FF7A66;font-weight:600;font-size:13px}

/* drawing (the lottery while Claude thinks) */
.draw-step{font-family:var(--f-mono);font-size:13px;display:flex;gap:8px;align-items:center;min-height:20px}
.draw-step::before{content:"▸";color:var(--red);animation:blink .8s steps(2) infinite}
.bar{height:4px;border-radius:999px;background:color-mix(in srgb,currentColor 15%,transparent);overflow:hidden;margin:12px 0 4px;direction:ltr}
[dir="rtl"] .bar{transform:scaleX(-1)}
.bar i{display:block;height:100%;width:0;background:currentColor;transition:width .5s ease-out}

/* actions + plans */
.acts{position:sticky;bottom:0;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;background:linear-gradient(to top,var(--night) 70%,transparent);z-index:3}
.p-receipt.t-build .acts{background:linear-gradient(to top,var(--build) 70%,transparent)}
.p-receipt.t-pivot .acts{background:linear-gradient(to top,var(--pivot) 70%,transparent)}
.p-receipt.t-kill .acts{background:linear-gradient(to top,var(--kill) 70%,transparent)}
.acts-row{display:flex;gap:8px}
.acts-row .cta{flex:1}
.btn-main{background:currentColor}
.btn-main span{filter:invert(1);mix-blend-mode:normal}
.p-receipt .btn-main{background:var(--night-ink);color:var(--night)}
.p-receipt.t-build .btn-main{background:var(--build-ink);color:var(--build)}
.p-receipt.t-pivot .btn-main{background:var(--pivot-ink);color:var(--pivot)}
.p-receipt.t-kill .btn-main{background:var(--kill-ink);color:var(--kill)}
.btn-ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.4px color-mix(in srgb,currentColor 40%,transparent)}
.acts .note{text-align:center}
.plans{display:grid;gap:10px;padding:8px 0 28px}
.plans-t{font-weight:700;font-size:20px;letter-spacing:-.02em}
.plans-s{font-size:13.5px;opacity:.75;margin-top:-4px}
.plan{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:14px 0;border-top:1.3px solid color-mix(in srgb,currentColor 18%,transparent)}
.plan b{font-weight:600}
.plan .pp{font-family:var(--f-mono);font-weight:600;font-size:18px;direction:ltr}
.plan button{border:1.4px solid currentColor;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.plan button[aria-pressed="true"]{background:currentColor}
.plan button[aria-pressed="true"] span{filter:invert(1)}

/* examples panel */
.p-ex{background:var(--b2);color:var(--b2-ink)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px max(20px,env(safe-area-inset-left,0px)) 28px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.xc{scroll-snap-align:center;flex:0 0 min(86vw,400px);min-height:min(68dvh,560px);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px}
.xc.build{background:var(--build);color:var(--build-ink)}
.xc.pivot{background:var(--pivot);color:var(--pivot-ink)}
.xc.kill{background:var(--kill);color:var(--kill-ink)}
.xc .cat{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.xc h3{margin:6px 0 0;font-weight:600;font-size:clamp(28px,7.4vw,40px);line-height:1.05;letter-spacing:-.035em}
.xc p{margin:0;font-size:15px;line-height:1.45;opacity:.85}
.xc .xw{margin-top:auto;font-family:var(--f-wide);font-weight:600;font-size:clamp(34px,10vw,52px);line-height:1}
.xc .cta{background:currentColor;align-self:stretch}
.xc .cta span{filter:invert(1)}
.xc.build .cta{background:var(--build-ink);color:var(--build)} .xc.pivot .cta{background:var(--pivot-ink);color:var(--pivot)} .xc.kill .cta{background:var(--kill-ink);color:var(--kill)}
.xc .cta span{filter:none}
.ex-intro{padding:4px 0 14px;font-size:15px;opacity:.75;max-width:40ch}

/* mine panel */
.p-mine{background:var(--b3);color:var(--b3-ink)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px max(20px,env(safe-area-inset-left,0px));cursor:pointer}
.mrow.build{background:var(--build);color:var(--build-ink)} .mrow.pivot{background:var(--pivot);color:var(--pivot-ink)} .mrow.kill{background:var(--kill);color:var(--kill-ink)}
.mrow h4{margin:0;font-weight:600;font-size:18px;line-height:1.2;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mrow p{margin:4px 0 0;font-family:var(--f-mono);font-size:11.5px;opacity:.7}
.mrow .mw{font-family:var(--f-wide);font-weight:600;font-size:clamp(18px,5vw,26px);white-space:nowrap}
.mdel{border:0;background:transparent;font-size:12px;text-decoration:underline;opacity:.7;padding:4px 0;color:inherit}
.empty{padding:36px 20px;display:grid;gap:10px;justify-items:start}
.empty b{font-size:24px;font-weight:600;letter-spacing:-.02em}
.empty span{opacity:.7;max-width:36ch}

@media (min-width:900px){
  .bands{flex-direction:row;flex-wrap:wrap}
  .b-idea{flex:1 1 100%;min-height:52dvh}
  .b-ex,.b-mine{flex:1 1 50%;min-height:calc(48dvh - 56px)}
  .b-mine{border-top:0}
}

/* icons: Lucide geometry with Animate UI style motion, in plain SVG + CSS */
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;overflow:visible;flex:none}
.ic g{transform-box:fill-box;transform-origin:center}
@keyframes ic-wob{0%{transform:none}25%{transform:rotate(-9deg) scale(.94)}55%{transform:rotate(8deg) scale(1.06)}80%{transform:rotate(-3deg)}100%{transform:none}}
@keyframes ic-shk{0%,100%{stroke-dasharray:1 1}45%{stroke-dasharray:.8 1}}
@keyframes ic-open{from{stroke-dasharray:1 1;transform:none}to{stroke-dasharray:.78 1;transform:translateY(-1.5px)}}
.ic-lock .shk{stroke-dasharray:1 1}
.ic-lock.idle g{animation:ic-wob 1.2s ease-in-out 1.2s infinite}
.ic-lock.idle .shk{animation:ic-shk 1.2s ease-in-out 1.2s infinite}
.ic-lock.unlock g{animation:ic-wob .6s ease-in-out}
.ic-lock.unlock .shk{animation:ic-open .4s ease-out .1s forwards}
@keyframes ic-nw{0%,100%{transform:none}50%{transform:translate(3px,-3px)}}
.band:hover .ic-arrow g,.band:focus-visible .ic-arrow g,.band:active .ic-arrow g{animation:ic-nw .6s ease-in-out}
@keyframes ic-back{0%,100%{transform:none}50%{transform:translateX(-4px)}}
.back:hover .ic-chev g,.back:active .ic-chev g{animation:ic-back .5s ease-in-out}
@keyframes ic-spin{to{transform:rotate(360deg)}}
@keyframes ic-spinb{to{transform:rotate(-360deg)}}
.ic-moon.spin g{animation:ic-spin .7s cubic-bezier(.3,.7,.2,1)}
.ic-plus g, .ic-plus .v{transition:transform .3s var(--ease);transform-box:fill-box;transform-origin:center}
[aria-expanded="true"] .ic-plus g{transform:rotate(180deg)}
[aria-expanded="true"] .ic-plus .v{transform:scaleY(0)}
@keyframes ic-drop{0%,100%{transform:none}50%{transform:translateY(3px)}}
.cta:hover .ic-dl .arr,.cta:active .ic-dl .arr{animation:ic-drop .6s ease-in-out;transform-box:fill-box}
.cta:hover .ic-again g,.cta:active .ic-again g{animation:ic-spinb .7s ease-in-out}
@keyframes ic-cp{0%,100%{transform:none}50%{transform:translate(-2px,-2px)}}
.cta:hover .ic-copy .front,.cta:active .ic-copy .front{animation:ic-cp .5s ease-in-out;transform-box:fill-box}
@keyframes ic-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

function show(v){

/* ---------- parallax: pointer depth on the home bands, scroll depth on the example cards ---------- */
(()=>{
  let raf=0, px=0, py=0;
  const apply=()=>{ raf=0; if (S.view || calm()) return;
    document.querySelectorAll(".band").forEach((b,k)=>{
      const big=b.querySelector(".b-big"), sub=b.querySelector(".b-sub,.tri"), d=[18,12,10][k]||10;
      if (big) big.style.transform=`translate3d(${px*d}px,${py*d*.6}px,0)`;
      if (sub) sub.style.transform=`translate3d(${px*d*.45}px,${py*d*.3}px,0)`;
    });
  };
  addEventListener("pointermove",e=>{ if(e.pointerType!=="mouse") return; px=e.clientX/innerWidth-.5; py=e.clientY/innerHeight-.5; if(!raf) raf=requestAnimationFrame(apply); },{passive:true});
  addEventListener("deviceorientation",e=>{ if(e.gamma==null) return; px=Math.max(-.5,Math.min(.5,e.gamma/40)); py=Math.max(-.5,Math.min(.5,(e.beta-45)/40)); if(!raf) raf=requestAnimationFrame(apply); },{passive:true});
})();

function cardHTML(b,o){

       + (o.id?`<div class="ks" data-kt="${esc(o.id)}"><span>${esc(R.ks)}:</span>${[["pending",R.ksP],["pass",R.ksY],["fail",R.ksN]].map(([v,l])=>`<button type="button" data-ks="${v}" aria-pressed="${ks===v}"><span>${esc(l)}</span></button>`).join("")}</div>`:""),

function wrapLines(x,str,maxW,maxLines){
  const words=String(str||"").split(/\s+/).filter(Boolean), out=[]; let line="";
  for (const w of words){ const tryL=line?line+" "+w:w; if (x.measureText(tryL).width<=maxW || !line) line=tryL; else { out.push(line); line=w; } }
  if (line) out.push(line);
  if (out.length>maxLines){ const keep=out.slice(0,maxLines); let last=keep[maxLines-1]; while(last && x.measureText(last+"…").width>maxW) last=last.slice(0,-1); keep[maxLines-1]=last.trim()+"…"; return keep; }
  return out;
}

function prompt(idea){

  return `You are Wazo, a blunt startup-idea judge. ${market} Judge the idea below honestly. Most ideas should NOT get BUILD.

Rules:
- verdict: BUILD, PIVOT or KILL.
- Four scores, 1-10, higher is always better for the founder: pain (how much the customer hurts), demand (how many want it), space (open space: 10 = no competition, 1 = crowded), pay (willingness to pay).
- Each score has an evidence grade: A = hard data on money people already spend, that you are confident of; B = strong documented signals; C = reasoning by analogy; D = assumption. You cannot browse, so grade honestly. If pain rests only on complaints with no sign of money already spent, pain is at most 6.
- Never invent precise statistics or market-size ceilings. Name a company only if you are confident it exists; otherwise describe the type ("several US scheduling startups").
- money: a monthly price per customer in ${cur}, and paying customers at month 12 for low/base/high, realistic for a small founding team. breaker = the single assumption that breaks the model.

- fit: the skills, budget and runway the idea demands.
- Voice: blunt, short sentences, no hype, no politeness. Never use dashes (—, –, -) as punctuation; use commas or periods. tip only if genuinely useful, else an empty string.
- Write ALL text values in ${lang}. Keep each text field to 1-2 short sentences; evidence fields under 18 words.

Idea: ${idea}
${cust?`Target customer: ${cust}\n`:""}${bud?`Founder budget for first 6 months: ${bud} ${cur}\n`:""}${time?`Founder time per week: ${time}\n`:""}
Reply with only one JSON object in exactly this shape:
{"idea":"one-line restatement of the idea","verdict":"PIVOT","headline":"one blunt sentence","deciding":"the one assumption everything rests on","tip":"","scores":[{"key":"pain","score":6,"grade":"B","evidence":"..."},{"key":"demand","score":5,"grade":"C","evidence":"..."},{"key":"space","score":3,"grade":"B","evidence":"..."},{"key":"pay","score":4,"grade":"C","evidence":"..."}],"money":{"price":150,"low":10,"base":40,"high":120,"breaker":"..."},"graveyard":[{"name":"...","why":"..."}],"competition":[{"name":"...","note":"..."}],"gap":"...","israel":"...","fit":"...","kill":{"action":"...","budget":${he?300:100},"pass":"..."}}

const errCopy=c=>({not_granted:t("errGranted"),sampling_disabled:t("errGranted"),rate_limited:t("errRate"),invalid_json:t("errJson"),refused:t("errRefused")}[c]||t("errGeneric"));

}

    if (S.view==="idea" && !ta.value && !calm()){
      const list=FEED.map(f=>f.idea[S.lang]); if(!txt) txt=list[i%list.length];
      if (hold>0){ hold--; }
      else if (dir>0){ pos++; if(pos>=txt.length){ dir=-1; hold=40; } }
      else { pos-=3; if(pos<=0){ pos=0; dir=1; i++; txt=list[i%list.length]; hold=6; } }
      ta.placeholder=txt.slice(0,pos)+(dir>0||hold?"":"");
    } else if (!ta.value) { ta.placeholder=t("ideaPh"); txt=""; pos=0; dir=1; }
    setTimeout(tick, dir>0?38:18);
  };
  setTimeout(tick, 600);
})();
function fitIdea(){
  const ta=$("#idea"); ta.style.height="auto"; ta.style.height=Math.max(ta.scrollHeight, 120)+"px";
}
$("#idea").addEventListener("input", fitIdea);

/* ---------- examples rail ---------- */
function renderRail(){
  const L=T[S.lang];
  $("#rail").innerHTML=FEED.map((f,i)=>{const x=f[S.lang]; return `<article class="xc ${VCLS(f.v)}">
    <span class="cat">${esc(x.cat)}</span><h3>${esc(x.t)}</h3><p>${esc(x.l)}</p>
    <span class="xw">${esc(L.vWord[f.v])}</span>
    <button class="cta" type="button" data-feed="${i}"><span>${esc(t("openFull"))}</span>${ic("arrow")}</button></article>`;}).join("");
}
function updExCount(){
  const r=$("#rail"), w=r.firstElementChild?.getBoundingClientRect().width||1;
  const i=Math.min(FEED.length-1, Math.round(Math.abs(r.scrollLeft)/(w+12)));
  $("#exCount").textContent=String(i+1).padStart(2,"0")+"/"+String(FEED.length).padStart(2,"0");
}
$("#rail").addEventListener("scroll", ()=>requestAnimationFrame(()=>{ updExCount(); railFx(); }), {passive:true});
$("#rail").addEventListener("click", e=>{ const b=e.target.closest("[data-feed]"); if(!b) return; $("#idea").value=FEED[+b.dataset.feed].idea[S.lang]; runVerdict(); });

/* ---------- yours (db) ---------- */
const col=()=>S.db.collection("data/users/"+S.uid);
async function save(b,raw){
  if (!S.db||!S.uid){ S.savedNote=t("notSaved"); return; }
  try { const ref=col().doc(); const doc={idea:b.idea,input:raw,lang:S.lang,verdict:b.verdict,brief:b,killStatus:"pending",createdAt:new Date().toISOString()};
    await ref.set(doc); S.currentId=ref.id; S.savedNote=t("saved"); S.mine=[{id:ref.id,...doc},...S.mine.filter(x=>x.id!==ref.id)]; renderHome();
  } catch(e){ S.savedNote=t("notSaved"); }
}
async function setKill(id,status){
  const it=S.mine.find(x=>x.id===id); if(!it||!S.db) return;
  it.killStatus=status; const st=$("#stage"); st.innerHTML=cardHTML(st._b,currentCard().o);
  try { await col().doc(id).update({killStatus:status}); } catch(e){}
}
async function loadDrawer(){
  if (!S.db||!S.uid){ renderDrawer(); return; }
  try { const snap=await col().orderBy("createdAt","desc").limit(200).get(); S.mine=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})); } catch(e){}
  S.mineLoaded=true; renderDrawer(); renderHome();
}
function renderDrawer(){
  const box=$("#drawerList");
  if (!S.ready){ box.innerHTML=`<div class="empty"><span>${esc(t("loading"))}</span></div>`; return; }
  if (!S.db||!S.uid){ box.innerHTML=`<div class="empty"><b>${esc(t("drOut"))}</b><span>${esc(t("drOutS"))}</span>${window.claude?"":`<a class="cta dark" href="${LIVE}" target="_blank" rel="noopener">claude.ai ↗</a>`}</div>`; return; }
  if (!S.mineLoaded && !S.mine.length){ box.innerHTML=`<div class="empty"><span>${esc(t("loading"))}</span></div>`; return; }
  if (!S.mine.length){ box.innerHTML=`<div class="empty"><b>${esc(t("drEmpty"))}</b><span>${esc(t("drEmptyS"))}</span><button class="cta dark" type="button" data-go="idea">${esc(t("navCta"))}</button></div>`; return; }
  const L=T[S.lang], df=new Intl.DateTimeFormat(S.lang==="he"?"he-IL":"en-GB",{day:"numeric",month:"short"});
  box.innerHTML=S.mine.map((m,k)=>{const ks=m.killStatus||"pending", c=S.confirmDel===m.id;
    return `<div class="mrow ${VCLS(m.verdict)}" data-row="${esc(m.id)}" style="--i:${Math.min(k,12)}">
      <div style="min-width:0"><h4>${esc(m.idea)}</h4><p>${esc(m.createdAt?df.format(new Date(m.createdAt)):"")} · ${esc(L.r.ks)}: ${esc(ks==="pass"?L.r.ksY:ks==="fail"?L.r.ksN:L.r.ksP)} · <button class="mdel" type="button" data-d="${esc(m.id)}">${esc(c?t("sure"):t("del"))}</button></p></div>
      <span class="mw">${esc(L.vWord[m.verdict]||"")}</span></div>`;}).join("");
}
$("#drawerList").addEventListener("click", async e=>{
  const d=e.target.closest("[data-d]"), row=e.target.closest("[data-row]");
  if (d){ const id=d.dataset.d; if (S.confirmDel===id){ S.confirmDel=null; S.mine=S.mine.filter(x=>x.id!==id); if(S.currentId===id) S.currentId=null; renderDrawer(); renderHome(); try{ await col().doc(id).delete(); }catch(_){} } else { S.confirmDel=id; renderDrawer(); } return; }
  if (row){ const m=S.mine.find(x=>x.id===row.dataset.row); if(!m) return; S.current=norm(m.brief||{}); S.currentId=m.id; S.isExample=false; S.savedNote=""; S.rev=new Set([1,2,3,4,5]); S.open=5; S.stampHit=true; go("receipt"); renderStage(); }
});

/* ---------- language / theme / boot ---------- */
function applyLang(){
  const app=$("#app"); app.dir=S.lang==="he"?"rtl":"ltr"; app.lang=S.lang; document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("#h1").innerHTML=t("h1");
  $("#idea").placeholder=t("ideaPh"); $("#fCust").placeholder=t("phCust"); $("#fBudget").placeholder=t("phBudget"); $("#fTime").placeholder=t("phTime");
  $("#langBtn").textContent=S.lang==="he"?"EN":"עב";
  if (S.ready && !S.sample) setNote(t("noSample"));
  renderHome(); renderRail(); renderDrawer(); if (S.current && !S.busy) renderStage();
}
function renderLegal(){
  $("#legalBody").innerHTML=`<p class="lead">${esc(t("legalLead"))}</p>`+t("legal").map(([h,p])=>`<section><h3>${esc(h)}</h3><p>${esc(p)}</p></section>`).join("")
    +`<div style="display:grid;gap:8px"><button class="cta light" type="button" id="delBtn">${esc(t("delReq"))}</button><span class="note" id="delNote"></span></div><p class="upd">${esc(t("legalUpd"))}</p>`;
  $("#delBtn").addEventListener("click", async ()=>{
    const n=$("#delNote"), btn=$("#delBtn");
    if (!S.db || !S.uid){ n.textContent=t("delNo"); return; }
    btn.disabled=true;
    try{ await S.db.collection("leads").doc(S.uid).set({deleteRequested:true,deleteAt:new Date().toISOString()},{merge:true}); n.textContent=t("delSent"); try{ localStorage.removeItem("wz.optin"); }catch(e){} }
    catch(e){ btn.disabled=false; n.textContent=t("errGeneric"); }
  });
}
$("#legalBtn").addEventListener("click",()=>{ renderLegal(); const d=$("#legal"); d.dir=S.lang==="he"?"rtl":"ltr"; if(d.showModal) d.showModal(); else d.setAttribute("open",""); });
$("#legalX").addEventListener("click",()=>$("#legal").close());
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));
$("#teams").addEventListener("click",e=>{ if(e.target===e.currentTarget) e.currentTarget.close(); });
function setPro(on){ S.pro=!!on; const b=$("#proBtn"); b.textContent=S.pro?"PRO":"FREE"; b.setAttribute("aria-pressed",S.pro); try{ localStorage.setItem("wz.pro",S.pro?"1":"0"); }catch(e){} if (S.current && !S.busy) renderStage(); }
function enablePreview(){ $("#proBtn").hidden=false; setPro(S.proPreview); }
$("#proBtn").addEventListener("click",()=>setPro(!S.pro));
$("#legal").addEventListener("click",e=>{ if(e.target===e.currentTarget) e.currentTarget.close(); });
$("#langBtn").addEventListener("click",()=>{ S.lang=S.lang==="he"?"en":"he"; try{localStorage.setItem("wz.lang",S.lang)}catch(e){} applyLang(); });
$("#themeBtn").addEventListener("click",()=>{ const m=$("#themeBtn .ic"); if(m){ m.classList.remove("spin"); void m.getBoundingClientRect(); m.classList.add("spin"); } const root=document.documentElement, cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); const next=cur==="dark"?"light":"dark"; root.setAttribute("data-theme",next); try{localStorage.setItem("wz.theme",next)}catch(e){} });

hydrateIcons(); applyLang();
if (location.hash==="#demo" && !window.claude){ S.current=norm({...EXAMPLE[S.lang],cur:CUR()}); S.isExample=false; S.optin=false; history.replaceState(null,"","#receipt"); enablePreview(); }
show(location.hash.slice(1)); if (S.current) renderStage();
(async()=>{
  if (!window.claude||!window.claude.use){ S.ready=true; setNote(t("noSample")); renderDrawer(); return; }
  const [sample,db,user]=await Promise.all([claude.use("sample"),claude.use("db"),claude.use("user")]);
  S.sample=sample; $("#goBtn").disabled=!sample; if(!sample) setNote(t("noSample"));
  if (user){ try{ S.uid=await user.id(); const me=await user.me(); const name=(me&&me.name)||"";
    if (S.uid){ $("#who").hidden=false; $("#whoN").textContent=name; $("#whoI").textContent=(name.trim()[0]||"·").toUpperCase(); }
    S.me={name, email:(me&&me.email)||""};
    if (await Promise.resolve(user.isOwner && user.isOwner())) enablePreview(); }catch(e){} }
  S.db=(db&&S.uid)?db:null; S.ready=true; renderDrawer(); loadDrawer();
  if (S.db && S.uid && !S.optin){ try{ const d=await S.db.collection("leads").doc(S.uid).get(); if(d.exists){ S.optin=true; const v=d.data()||{}; if(v.plan) S.plan=v.plan; if (S.current) renderStage(); } }catch(e){} }
})();
})();
</script>
</body></html>
