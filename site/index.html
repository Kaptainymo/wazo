<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wazo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;600&family=Miriam+Libre:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* design system: line heights are whole even pixels. Each rule sets a ratio (--lhr); every element turns it into px from its own font size. */
:root{--lhr:1.4}
*,*::before,*::after{line-height:round(calc(var(--lhr)*1em),2px)}
@supports not (width:round(1px,1px)){*,*::before,*::after{line-height:var(--lhr)}}

/* Mobile-first, Currency-style: the home screen is three full-bleed bands (your idea, examples, yours).
   Tap a band and it opens full screen. A receipt is a stack of big-type rows; when the verdict is
   revealed the whole sheet floods with the verdict color: BUILD green, PIVOT amber, KILL red. */
:root{
  --bg:#0E0E0E; --ink:#F1F0EC; --muted:#8E8C87; --line:#2A2A2A; --red:#F07167;
  --b1:#F07167; --b1-ink:#0A0A0A; --b2:#1C1C1C; --b2-ink:#F1F0EC; --b3:#0E0E0E; --b3-ink:#F1F0EC; --b2m:#0E0E0E;
  --night:#0A0A0A; --night-ink:#F4F3EF; color-scheme:dark;
  --build:#A8DADC; --build-ink:#0F2A2C; --pivot:#F1FAEE; --pivot-ink:#1B2626; --kill:#F07167; --kill-ink:#2B0B07;
  --cta-h:52px;
  --f-sans:"Hanken Grotesk","IBM Plex Sans Hebrew","Segoe UI",system-ui,sans-serif;
  --f-wide:"Unbounded","Miriam Libre","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","IBM Plex Sans Hebrew",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);font-size:16px;--lhr:1.5;-webkit-font-smoothing:antialiased}
html.lock{overflow:hidden}
button,input,textarea{font-family:inherit;font-size:inherit;font-weight:inherit;font-style:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.mono{font-family:var(--f-mono)}
.sr{margin:0;position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.in{width:100%;max-width:680px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left,0px))}

/* nav */
nav.top{position:sticky;top:0;z-index:20;background:var(--b1);color:var(--b1-ink);padding-top:env(safe-area-inset-top,0px)}
nav.top .in{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:none}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em;direction:ltr;text-decoration:none;color:inherit;display:flex;gap:2px;align-items:flex-start}
.brand sup{font-size:12px;margin-top:3px}
.navr{display:flex;gap:8px;align-items:center;position:relative}
.ts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80}
.ts:empty{display:none}
#ideaPlans,#gatePlans{margin-top:16px}
.langmenu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;min-width:220px;background:var(--b1);color:var(--b1-ink);border-radius:18px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.28);border:1px solid color-mix(in srgb,currentColor 14%,transparent);z-index:40;transform-origin:top right;animation:menuIn .24s var(--ease) both}
[dir=rtl] .langmenu{transform-origin:top left}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
.lopt{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:12px 16px;border:0;background:transparent;color:inherit;border-radius:12px;font-family:inherit;font-size:16px;font-weight:500;text-align:start;cursor:pointer}
.lopt:hover,.lopt:focus-visible{background:color-mix(in srgb,currentColor 9%,transparent);outline:none}
.lopt small{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;opacity:.55}
.lopt[aria-checked="true"] small{opacity:1}
.lopt[aria-checked="true"] small::before{content:"✓ "}
#langSheet .sheet-b{gap:2px}
#langSheet .lopt{padding:16px 16px;font-size:20px}
.pill{height:36px;min-width:36px;padding:0 12px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 30%,transparent);background:transparent;font-family:var(--f-mono);font-size:12px;font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:14px;opacity:.8}
.who i{width:28px;height:28px;border-radius:50%;background:var(--b1-ink);color:var(--b1);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.who span{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.who span{display:none}}

/* home bands */
.bands{display:flex;flex-direction:column;min-height:calc(100dvh - 56px - env(safe-area-inset-top,0px))}
.band{all:unset;line-height:round(calc(var(--lhr)*1em),2px);box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:22px max(20px,env(safe-area-inset-left,0px)) 24px;position:relative;transition:filter .25s}
.band:active{filter:brightness(.94)}
.band:focus-visible{outline:3px solid var(--red);outline-offset:-3px}
.b-idea{background:var(--b1);color:var(--b1-ink);flex:1.5 1 0;min-height:280px}
.b-ex{background:var(--b2);color:var(--b2-ink);flex:1 1 0;min-height:190px}
.b-mine{background:var(--b1);color:var(--b1-ink);flex:1 1 0;min-height:190px}
.b-lab{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;display:flex;gap:12px}
#app[dir="rtl"] .b-lab,#app[dir="rtl"] .ph-t{letter-spacing:0}
.b-big{font-weight:500;font-size:round(clamp(40px,11vw,84px),2px);--lhr:.95;letter-spacing:-.045em;display:flex;align-items:baseline;justify-content:center;gap:16px;flex-wrap:wrap;width:100%}
.b-big b{font-weight:500;font-variant-numeric:tabular-nums;direction:ltr}
.b-big small{font-size:round(clamp(17px,4.4vw,26px),2px);letter-spacing:-.01em;opacity:.7;font-weight:500}
.caret{display:inline-block;width:4px;height:round(.8em,2px);background:var(--red);margin-inline-end:8px;animation:blink 1s steps(2) infinite;transform:translateY(round(.06em,1px))}
@keyframes blink{50%{opacity:0}}
.b-arrow{position:absolute;top:18px;inset-inline-end:max(20px,env(safe-area-inset-right,0px));font-size:24px;opacity:.55}

.b-sub{display:block;font-size:14px;opacity:.65;max-width:34ch;margin-inline:auto;text-align:center}
/* Layout B (test): idea 50%, examples 25%, yours 25% of the screen */
.lay-b .bands{height:calc(100dvh - 56px - env(safe-area-inset-top,0px));min-height:560px;flex-direction:column!important;flex-wrap:nowrap!important}
.lay-b .b-idea{flex:2 1 0!important;min-height:0!important}
.lay-b .b-ex,.lay-b .b-mine{flex:1 1 0!important;min-height:0!important;overflow:hidden;gap:12px;padding-top:16px}
.lay-b .b-ex .b-big,.lay-b .b-mine .b-big{font-size:round(clamp(34px,8.5vw,60px),2px)}
.lay-b .b-ex .legend{display:none}
@media (min-width:900px){.lay-b .b-ex .legend{display:flex}}

.strip{--g:10px;--mq:40s;position:absolute;left:0;right:0;bottom:0;height:35px;display:flex;justify-content:center;align-items:flex-end;gap:var(--g)}
@media (min-width:900px){.strip{--g:23px;--mq:75s;height:80px}}
.strip.mq{direction:ltr;justify-content:flex-start;gap:0;overflow:hidden}
.strip .trk{display:flex;flex:none;gap:0;will-change:transform;animation:mq var(--mq) linear infinite}
.strip .set{display:flex;flex:none;gap:var(--g);padding-inline-end:var(--g)}
@keyframes mq{to{transform:translateX(-25%)}}
@media (prefers-reduced-motion:reduce){.strip .trk{animation:none}}
.strip i{display:block;position:relative;flex:0 0 auto;width:37px;height:35px;border-radius:5px;overflow:hidden;font-style:normal}
@media (min-width:900px){.strip i{width:70px;height:80px;border-radius:10px}}
.strip i.u{background:color-mix(in srgb,currentColor 22%,transparent)}
.strip i::before{content:"";position:absolute;inset:0;mix-blend-mode:difference;pointer-events:none;background-repeat:repeat;background-size:64px 64px;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><filter id="n" color-interpolation-filters="sRGB" x="0" y="0" width="100%25" height="100%25"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0.1054 0 0 0.1435 -0.0617 0 0.1054 0 0.1435 -0.0617 0 0 0.1054 0.1435 -0.0617 0 0 0 0 1"/></filter><rect width="64" height="64" filter="url(%23n)"/></svg>')}
.b-ex,.b-mine{padding-bottom:44px!important;justify-content:flex-start!important}
.b-ex .b-big,.b-mine .b-big{margin-block:auto}
/* Phone (Figma 390x844): nav 56, 24 gaps, bands 313 / 190 / 189, left-aligned copy */
@media (max-width:899px){
  .bands{background:var(--bg);height:auto;min-height:calc(100dvh - 56px - env(safe-area-inset-top,0px));display:grid;grid-template-rows:minmax(240px,313fr) minmax(190px,190fr) minmax(189px,189fr);gap:24px;padding-block:0 24px}
  .bands>.band{min-height:0!important;overflow:hidden}
  .b-arrow{top:22px;height:22px;line-height:22px}
  .bands .b-idea{padding:24px 32px 24px}
  .b-idea .b-arrow{inset-inline-end:32px}
  .b-idea .b-big{justify-content:flex-start;flex-wrap:nowrap;gap:8px;font-size:44px}
  .b-idea .caret{height:34px;margin-inline-end:0;transform:none}
  .b-idea .b-sub{margin-inline:0;text-align:start;max-width:300px}
  .bands .b-ex,.bands .b-mine{padding:24px 20px 0!important;gap:0}
  .b-mine{background:var(--b3);color:var(--b3-ink)}
  .b-ex{background:var(--b2m)}
  .b-ex .b-big,.b-mine .b-big{font-size:36px;justify-content:flex-start;flex-wrap:nowrap;gap:16px;width:auto;margin:48px 0 0}
  .b-ex .b-big small,.b-mine .b-big small{font-size:16px;letter-spacing:-.01em}
  .strip{bottom:14px}
}
@media (max-width:359px){.b-idea .b-big{font-size:40px}}
.tri{display:flex;height:10px;border-radius:999px;overflow:hidden;width:min(100%,420px)}
.tri i{display:block}
.legend{display:flex;gap:16px;font-family:var(--f-mono);font-size:12px;opacity:.75;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:8px}
.legend span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.testtag{display:block;color:var(--red);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.foot{padding:18px 20px calc(28px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);text-align:center}

/* panels */
.panel{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:rise .42s var(--ease) both;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.ph{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-left,0px)) 0;background:inherit}
.back{border:0;background:transparent;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;padding:8px 8px;color:inherit}
.back .chev{font-size:24px;--lhr:1;display:inline-block}

.ph-t{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.ph-r{min-width:44px;display:flex;justify-content:flex-end}

/* idea panel */
.p-idea{background:var(--b1);color:var(--b1-ink);--tool-line:rgba(10,10,10,.38)}
.ibox{position:relative;border-radius:28px;padding:20px 24px}
.ibox.dropping{box-shadow:inset 0 0 0 2px #0A0A0A}
.ibar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;min-height:44px}
.itools{display:flex;gap:8px}
.itool{all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:50%;border:1px solid var(--tool-line,rgba(10,10,10,.38));color:#0A0A0A;display:grid;place-items:center;cursor:pointer;transition:background-color .2s,color .2s}
.itool:focus-visible{outline:3px solid #0A0A0A;outline-offset:2px}
@media (hover:hover){.itool:hover{background:rgba(10,10,10,.1)}}
.itool.on{background:#0A0A0A;color:#F4F3EF;animation:micpulse 1.4s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(10,10,10,.4)}50%{box-shadow:0 0 0 10px rgba(10,10,10,0)}}
.itmsg{font-size:14px;--lhr:1.4;flex:1 1 140px;min-width:0}
@media (prefers-reduced-motion:reduce){.itool.on{animation:none}}
.p-idea,.b-idea{--red:#0A0A0A}
.p-idea input::placeholder,.p-idea textarea::placeholder{color:#0A0A0A;opacity:.74}
.p-idea textarea#idea::placeholder{opacity:.65}
.p-idea .helpbox .hh,.p-idea .helpbox .hnote{opacity:1}
.p-idea .fields input::placeholder,.p-idea .helpbox input::placeholder{opacity:.78}
.p-idea .fields input,.p-idea .helpbox .row input{border-color:var(--tool-line)}
.p-idea .helpbox{border-color:color-mix(in srgb,currentColor 60%,transparent)}
.p-idea .fields label{opacity:.9}
.b-idea .b-lab,.b-idea .b-sub{opacity:.9}
.p-idea .ph-t,.p-idea .morebtn,.p-idea .hh,.p-idea label,.p-idea .note,.p-idea .hnote,.p-idea .picks small{opacity:.88}
.p-idea .cta:not(.dark):not(.light){background:#0A0A0A;color:#F4F3EF}
.p-idea .in{display:grid;gap:20px;padding-top:12px;padding-bottom:40px}
textarea#idea{width:100%;resize:none;border:0;background:transparent;color:inherit;caret-color:var(--red);font-weight:500;font-size:round(clamp(30px,8vw,52px),2px);--lhr:1.1;letter-spacing:-.03em;padding:0;min-height:4.6em;overflow:hidden}
textarea#idea::placeholder{color:currentColor;opacity:.35}
textarea#idea:focus{outline:none}
.morebtn{justify-self:start;border:0;background:none;padding:4px 0;font-size:14px;font-weight:500;color:inherit;opacity:.7;text-decoration:underline;text-underline-offset:3px}
.helprow{display:flex;gap:20px;flex-wrap:wrap}
/* the three links under the idea box are buttons, the same look as the quick topics */
.p-idea .helprow{gap:8px}
.p-idea .helprow .morebtn,.p-idea #moreBtn{min-height:44px;padding:0 20px;white-space:nowrap;border:1px solid var(--tool-line);border-radius:999px;font-size:16px;font-weight:500;color:#0A0A0A;opacity:1;text-decoration:none;line-height:round(calc(var(--lhr)*1em),2px);cursor:pointer;transition:background-color .15s,color .15s}
@media (hover:hover){.p-idea .helprow .morebtn:hover,.p-idea #moreBtn:hover{background:rgba(10,10,10,.08)}}
.p-idea #moreBtn[aria-expanded="true"]{background:#0A0A0A;color:#fff}
@media (hover:hover){.p-idea #moreBtn[aria-expanded="true"]:hover{background:#333}}
.p-idea .helprow .morebtn:focus-visible,.p-idea #moreBtn:focus-visible{outline:3px solid #0A0A0A;outline-offset:2px}
.helpbox{border:1px solid color-mix(in srgb,currentColor 25%,transparent);border-radius:20px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;font-size:16px;--lhr:1.55;min-width:0}
.helpbox[hidden]{display:none}
.helpbox .hh{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.helpbox .hh button{all:unset;line-height:round(calc(var(--lhr)*1em),2px);cursor:pointer;font-size:24px;padding:0 8px}
.helpbox p{margin:0}
.helpbox{scroll-margin-top:76px}
.helpbox:focus{outline:none}
.hload{display:grid;gap:12px;padding:8px 0 2px}
.hload b{font-size:16px;font-weight:700}
.hload .bar{position:relative;height:6px;border-radius:999px;overflow:hidden;background:color-mix(in srgb,currentColor 14%,transparent)}
.hload .bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:999px;background:var(--red);animation:hslide 1.2s var(--ease-io,cubic-bezier(.65,0,.35,1)) infinite}
@keyframes hslide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.hload .bar::after{width:100%;animation:hpulse 1.6s ease-in-out infinite}@keyframes hpulse{50%{opacity:.35}}}
.helpbox .chips{display:flex;gap:8px;flex-wrap:wrap}
.helpbox .chips span{font-size:14px;color:var(--red);font-weight:600}
.helpbox .hnote{font-size:14px;opacity:.6}
.helpbox .picks{display:grid;gap:8px}
.helpbox .picks button{all:unset;line-height:round(calc(var(--lhr)*1em),2px);cursor:pointer;display:block;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,currentColor 9%,transparent);--lhr:1.4}
.helpbox .picks button:hover,.helpbox .picks button:focus-visible{outline:2px solid var(--red)}
.helpbox .picks small{display:block;opacity:.65;font-size:14px;margin-top:2px}
.helpbox .row{display:flex;gap:8px}
.helpbox .row input{flex:1;min-width:0;width:100%;border:1px solid color-mix(in srgb,currentColor 25%,transparent);background:transparent;border-radius:999px;padding:12px 20px;font-size:16px;color:inherit}
.p-idea .helpbox .row .cta{width:auto;flex:none;height:48px;padding:0 20px;font-size:16px}
.fields{display:none;gap:12px}
.p-idea.more .fields{display:grid}
.fields label{display:grid;gap:4px;font-size:12px;opacity:.75}
.fields input{border:1px solid color-mix(in srgb,currentColor 25%,transparent);background:transparent;border-radius:999px;padding:12px 20px;font-size:16px;min-width:0}
.fields input:focus{outline:none;border-color:currentColor}
.fields input::placeholder{color:currentColor;opacity:.4}
.cta{height:var(--cta-h);border:0;border-radius:999px;padding:0 28px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.cta.light{background:var(--b1-ink);color:var(--b1)}
.cta.dark{background:var(--ink);color:var(--bg)}
.cta.on{background:currentColor}
.cta:disabled{opacity:.35}
.p-idea .cta{width:100%}
.note{font-size:14px;opacity:.7}
.note.err{color:var(--red);opacity:1;font-weight:600}

/* receipt panel: tone = none | night | build | pivot | kill */
.p-receipt{background:var(--night);color:var(--night-ink);transition:background-color .7s var(--ease),color .7s var(--ease)}
.rc{padding-top:8px}
.rc-meta{font-family:var(--f-mono);font-size:12px;opacity:.6;display:flex;justify-content:space-between;gap:12px;direction:ltr}
[dir="rtl"] .rc-meta{flex-direction:row-reverse}
.rc-idea{font-weight:600;font-size:round(clamp(24px,6.4vw,38px),2px);--lhr:1.12;letter-spacing:-.025em;margin:16px 0 24px}
.c-cnt{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);direction:ltr}
.rrow{border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.rrow:last-of-type{border-bottom:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.rh{all:unset;line-height:round(calc(var(--lhr)*1em),2px);box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 0;min-height:76px}
.rh:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.rn{font-family:var(--f-mono);font-size:12px;opacity:.55;align-self:start;padding-top:8px}
.rl{display:grid;gap:2px}
.rl b{font-weight:600;font-size:16px}
.rl small{font-size:12px;opacity:.6}
.rv{font-weight:500;font-size:round(clamp(34px,10vw,56px),2px);--lhr:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums;direction:ltr;text-align:end;white-space:nowrap}
.rv.dim{opacity:.28}
.rv sub{font-size:.36em;letter-spacing:0;vertical-align:baseline;opacity:.7;margin-inline-start:4px}
.rrow.final .rv.word{font-family:var(--f-wide);font-weight:600;font-size:round(clamp(30px,9vw,56px),2px);letter-spacing:-.01em;direction:inherit;white-space:nowrap}
.rb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.rrow.open .rb{grid-template-rows:1fr}
.rb>div{overflow:hidden}
.rbi{padding:0 0 20px;display:grid;gap:12px;font-size:16px;--lhr:1.5}

/* icons: Lucide geometry with Animate UI style motion, in plain SVG + CSS */
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;overflow:visible;flex:none}

@keyframes ic-wob{0%{transform:none}25%{transform:rotate(-9deg) scale(.94)}55%{transform:rotate(8deg) scale(1.06)}80%{transform:rotate(-3deg)}100%{transform:none}}

@keyframes ic-shake{0%,100%{transform:none}20%{transform:translateX(-1.5px)}40%{transform:translateX(1.5px)}60%{transform:translateX(-1px)}80%{transform:translateX(1px)}}
.ic-trash.arm .lid{animation:ic-lid .35s ease-out forwards}
.ic-trash.arm g{animation:ic-shake .4s ease-in-out .35s}
@keyframes ic-nw{0%,100%{transform:none}50%{transform:translate(3px,-3px)}}
.band:hover .ic-arrow g,.band:focus-visible .ic-arrow g,.band:active .ic-arrow g{animation:ic-nw .6s ease-in-out}
@keyframes ic-back{0%,100%{transform:none}50%{transform:translateX(-4px)}}

@keyframes ic-spin{to{transform:rotate(360deg)}}

/* ---------- data ---------- */
function undash(x){ const he=S.lang==="he"; return String(x||"").replace(/(\d)\s*[–—]\s*(\d)/g, "$1"+({he:" עד ",en:" to ",es:" a ",fr:" à "}[S.lang]||" to ")+"$2").replace(/\s+[–—-]\s+|[–—]/g, ", "); }
function norm(b){ b=JSON.parse(JSON.stringify(b||{}), (k,v)=>typeof v==="string"?undash(v):v);
  const V=["BUILD","PIVOT","KILL"], n=x=>{const v=Number(String(x).replace(/[^\d.]/g,""));return isFinite(v)?v:0;};
  const scores=["pain","demand","space","pay"].map(k=>{const s=(Array.isArray(b.scores)?b.scores:[]).find(x=>x&&x.key===k)||{};
    return {key:k,score:Math.max(1,Math.min(10,Math.round(n(s.score)||1))),grade:["A","B","C","D"].includes(s.grade)?s.grade:"D",evidence:String(s.evidence||"")};});
  const m=b.money||{}, k=b.kill||{};
  return {idea:String(b.idea||""),title:String(b.title||"").replace(/[.־–—-]+$/,"").trim().slice(0,40),verdict:V.includes(b.verdict)?b.verdict:"PIVOT",headline:String(b.headline||""),deciding:String(b.deciding||""),tip:b.tip?String(b.tip):"",
    scores,money:{price:n(m.price),low:n(m.low),base:n(m.base),high:n(m.high),breaker:String(m.breaker||"")},
    graveyard:(Array.isArray(b.graveyard)?b.graveyard:[]).slice(0,4).map(g=>({name:String(g.name||""),why:String(g.why||"")})),
    competition:(Array.isArray(b.competition)?b.competition:[]).slice(0,5).map(c=>({name:String(c.name||""),note:String(c.note||"")})),
    gap:String(b.gap||""),israel:String(b.israel||""),fit:String(b.fit||""),cur:b.cur||CUR(),
    kill:{action:String(k.action||""),budget:Math.min(b.cur==="₪"?700:200,n(k.budget)),pass:String(k.pass||"")}};
}
function hash(s){ let h=2166136261; for (const c of String(s)) { h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function ideaTitle(b){ if(b.title) return b.title; const w=String(b.idea||"").replace(/[.,;:!?]/g,"").split(/\s+/).filter(Boolean); return w.slice(0,4).join(" ")+(w.length>4?"…":""); }
function fileSlug(str){ return String(str||"").replace(/…/g,"").trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-+|-+$/g,"").slice(0,40)||"idea"; }
function receiptNo(seed){ return String(hash(seed)%1000000).padStart(6,"0"); }

/* ---------- navigation: home bands + full-screen panels ---------- */
const PANELS={idea:"#p-idea",receipt:"#p-receipt",examples:"#p-ex",mine:"#p-mine"};
let TAP=null;
document.addEventListener("pointerdown",e=>{ TAP={x:e.clientX,y:e.clientY}; },{capture:true,passive:true});
function show(v){
  const prev=S.view; S.view=v||"";
  if (prev==="receipt" && S.view!=="receipt" && S.restoreLang){ const back=S.restoreLang; S.restoreLang=null; S.lang=back; setTimeout(applyLang,0); }
  Object.entries(PANELS).forEach(([k,sel])=>{
    const el=$(sel), on=k===S.view;
    if (on && el.hidden){ el.hidden=false; if(!calm()){ const o=TAP||{x:innerWidth/2,y:innerHeight/2}; el.style.setProperty("--ox",o.x+"px"); el.style.setProperty("--oy",o.y+"px"); el.classList.remove("closing"); el.classList.add("opening"); el.addEventListener("animationend",ev=>{ if(ev.target===el) el.classList.remove("opening"); },{once:true}); } }
    else if (!on && !el.hidden){ if (!calm() && k===prev){ el.classList.remove("opening"); el.classList.add("closing"); el.addEventListener("animationend",function done(ev){ if(ev.target!==el) return; el.removeEventListener("animationend",done); el.classList.remove("closing"); if(S.view!==k) el.hidden=true; }); } else el.hidden=true; }
  });
  TAP=null;
  document.documentElement.classList.toggle("lock", !!S.view);
  if (S.view==="idea") setTimeout(()=>{ $("#idea").focus({preventScroll:true}); fitIdea(); }, 60);
  if (S.view==="examples") { $("#rail").scrollLeft=0; updExCount(); requestAnimationFrame(()=>{ fitWords(); railFx(); }); setTimeout(fitWords,500); }
  if (S.view==="receipt") setTimeout(fitWords,60);
  if (S.view==="mine") renderDrawer();
  if (S.view==="receipt" && !S.current && !S.busy) { S.view=""; show(""); }
}
function go(v){ if (location.hash.slice(1)===v) show(v); else location.hash=v; }
function home(){ if (location.hash) history.replaceState(null,"",location.pathname+location.search); show(""); }
addEventListener("hashchange",()=>show(location.hash.slice(1)));
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if (g){ go(g.dataset.go); return; }
  if (e.target.closest("[data-back]")){ home(); }
});
addEventListener("keydown",e=>{ if(e.key==="Escape" && S.view && !S.busy) home(); });

/* ---------- home bands ---------- */
function fillStrip(el,verdicts,always){
  const sig=verdicts.slice(0,9).join()+"|"+el.clientWidth; if(el._sig===sig) return; el._sig=sig;
  const tiles=verdicts.slice(0,9).map(v=>v?`<i style="background:var(--${VCLS(v)})"></i>`:`<i class="u"></i>`).join("");
  el.classList.remove("mq"); el.innerHTML=tiles;
  const first=el.firstElementChild; if(!first||calm()) return;
  const gap=parseFloat(getComputedStyle(el).columnGap)||0;
  if(!always && verdicts.slice(0,9).length*(first.offsetWidth+gap)<=el.clientWidth) return;
  el.innerHTML=`<span class="trk">${`<span class="set">${tiles}</span>`.repeat(4)}</span>`; el.classList.add("mq");
}
function renderStrips(){
  fillStrip($("#tri"),FEED.map(f=>f.v),true);
  fillStrip($("#mineStrip"),(S.mine||[]).map(x=>(x&&x.verdict)||""));
}
let stripT; addEventListener("resize",()=>{ clearTimeout(stripT); stripT=setTimeout(renderStrips,200); });
function renderHome(){
  if (!S.homeDone && !calm()){ S.homeDone=true; $("#home").classList.add("enter"); setTimeout(()=>$("#home").classList.remove("enter"),1300);
    setTimeout(()=>{ const n=$("#exN"); n.dataset.to=FEED.length; countUp(n); },250); }
  $("#exN").textContent=FEED.length;
  renderStrips();
  $("#mineN").textContent = S.mine.length;
}

/* ---------- parallax: pointer depth on the home bands, scroll depth on the example cards ---------- */
(()=>{
  let raf=0, px=0, py=0;
  const apply=()=>{ raf=0; if (S.view || calm()) return;
    document.querySelectorAll(".band").forEach((b,k)=>{
      const big=b.querySelector(".b-big"), sub=b.querySelector(".b-sub"), d=[18,12,10][k]||10;
      if (big) big.style.transform=`translate3d(${px*d}px,${py*d*.6}px,0)`;
      if (sub) sub.style.transform=`translate3d(${px*d*.45}px,${py*d*.3}px,0)`;
    });
  };
  addEventListener("pointermove",e=>{ if(e.pointerType!=="mouse") return; px=e.clientX/innerWidth-.5; py=e.clientY/innerHeight-.5; if(!raf) raf=requestAnimationFrame(apply); },{passive:true});
  addEventListener("deviceorientation",e=>{ if(e.gamma==null) return; px=Math.max(-.5,Math.min(.5,e.gamma/40)); py=Math.max(-.5,Math.min(.5,(e.beta-45)/40)); if(!raf) raf=requestAnimationFrame(apply); },{passive:true});
})();
/* keep big verdict words on one line: shrink to fit */
function textW(el){ const r=document.createRange(); r.selectNodeContents(el); const c=el.closest(".xc"); const k=c&&c.offsetWidth?c.getBoundingClientRect().width/c.offsetWidth:1; return r.getBoundingClientRect().width/(k||1); }
function fitWord(el,maxW){ if(!el||maxW<=0) return; el.style.fontSize=""; let fs=parseFloat(getComputedStyle(el).fontSize), g=40; while(textW(el)>maxW && fs>16 && g--){ fs-=2; el.style.fontSize=fs+"px"; } }
function fitWords(){
  document.querySelectorAll(".xc .xw").forEach(w=>{ const c=w.parentElement, cs=getComputedStyle(c); fitWord(w, c.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-20); });
  const v=document.getElementById("vword"); if(v){ const cc=v.closest(".cc"), row=cc||v.closest(".rrow"); if(row) fitWord(v, cc?row.clientWidth-44:row.clientWidth*0.62); }
  document.querySelectorAll(".mw").forEach(w=>{ const c=w.parentElement; if(c) fitWord(w, c.clientWidth*0.9); });
}
addEventListener("resize",()=>{ if (S.current && !S.busy && S.view==="receipt" && isWide()!==S._cm) renderStage(); });
let fitQ=0; const fitSoon=()=>{ if(fitQ) return; fitQ=requestAnimationFrame(()=>{ fitQ=0; fitWords(); }); };
addEventListener("resize",fitSoon);
try{ document.fonts.ready.then(fitSoon); }catch(e){}
function railFx(){
  if (calm()) return; const r=$("#rail"), rr=r.getBoundingClientRect(), cx=rr.left+rr.width/2;
  r.querySelectorAll(".xc").forEach(c=>{ const b=c.getBoundingClientRect(), d=Math.max(-1.4,Math.min(1.4,(b.left+b.width/2-cx)/b.width));
    c.style.transform=`scale(${1-Math.abs(d)*.05})`;
    const h=c.querySelector("h3"), w=c.querySelector(".xw"), p=c.querySelector("p");
    const e=Math.max(-1,Math.min(1,d)); if(h) h.style.transform=`translateX(${e*10}px)`; if(p) p.style.transform=`translateX(${e*6}px)`; if(w) w.style.transform=`translateX(${e*-14}px)`; });
}

/* ---------- the receipt: big-type rows ---------- */
function cardHTML(b,o,only){
  const L=T[S.lang], R=L.r, seed=o.id||b.idea, C=b.cur||CUR(), M=n=>C+fmt(n);
  const d=o.date?new Date(o.date):new Date();
  const dt=new Intl.DateTimeFormat(LOC[S.lang],{day:"2-digit",month:"2-digit",year:"2-digit"}).format(d);
  const ln=(k,v,g)=>`<div class="ln"><span class="k">${esc(k)}</span><span class="fill"></span><span class="v">${v}</span>${g?`<span class="g">${g}</span>`:""}</div>`;
  const ks=o.killStatus||"pending", seen=i=>S.rev.has(i), done=need().every(seen);
  const N=(n,f)=>`<span class="num" data-to="${n}"${f?' data-f="1"':""}>${f?fmt(n):n}</span>`;
  const big={
    1:b.scores.map(s=>N(s.score)).join(" "),
    2:C+N(b.money.base*b.money.price,1),
    3:C+N(b.kill.budget,1),
    4:`${N(b.graveyard.length)}·${N(b.competition.length)}`,
  };
  const sub={1:t("unitScores"),2:t("unit"),3:t("unitTest"),4:t("unitFine")};
  const body={
    1: b.scores.map(s=>ln(L.sc[s.key],`${s.score}/10`,s.grade)+`<div class="ev">${esc(s.evidence)}</div>`).join(""),
    2: `<div class="ln"><span class="k">${esc(R.price)}</span><span class="fill"></span><span class="v">${C}<input class="price-in" id="priceIn" type="number" min="0" step="10" value="${b.money.price}" aria-label="${esc(R.price)}"></span></div>`
       + ["low","base","high"].map(k=>`<div class="ln"><span class="k">${esc(R[k])} · ${fmt(b.money[k])} ${esc(R.cust)}</span><span class="fill"></span><span class="v" data-m="${k}">${M(b.money[k]*b.money.price)}</span></div>`).join("")
       + `<div class="nt"><b>${esc(R.breaker)}:</b> ${esc(b.money.breaker)}</div>`,
    3: proLocked(3) ? paywallHTML() : `<div class="nt">${esc(b.kill.action)}</div><div class="nt"><b>${esc(R.pass)}:</b> ${esc(b.kill.pass)}</div>`
       + (o.id?`<div class="ks" data-kt="${esc(o.id)}"><span>${esc(R.ks)}:</span>${[["pending",R.ksP],["pass",R.ksY],["fail",R.ksN]].map(([v,l])=>`<button type="button" data-ks="${v}" aria-pressed="${ks===v}"><span>${esc(l)}</span></button>`).join("")}</div>`:""),
    4: proLocked(4) ? paywallHTML() : `<div class="nt"><b>${esc(R.grave)}</b><ul>${b.graveyard.map(g=>`<li><b>${esc(g.name)}</b>: ${esc(g.why)}</li>`).join("")}</ul></div>`
       + `<div class="nt"><b>${esc(R.comp)}</b><ul>${b.competition.map(c=>`<li><b>${esc(c.name)}</b>: ${esc(c.note)}</li>`).join("")}</ul></div>`
       + `<div class="nt"><b>${esc(R.gap)}:</b> ${esc(b.gap)}</div><div class="nt"><b>${esc(R.il)}:</b> ${esc(b.israel)}</div><div class="nt"><b>${esc(R.fit)}:</b> ${esc(b.fit)}</div><div class="cav">${esc(R.cav)}</div>`,
    5: !unlocked() ? gateHTML() : `<div class="bline">${esc(b.headline)}</div><div class="nt"><b>${esc(R.rests)}:</b> ${esc(b.deciding)}</div>` + (b.tip?`<div class="tip"><span class="tip-l">${esc(R.tip)}</span><p>${esc(b.tip)}</p></div>`:"")
  };
  const titles={1:t("rowsScores"),2:t("rowsMoney"),3:t("rowsTest"),4:t("rowsFine"),5:t("rowsTotal")};
  S._cm=isWide();
  {
    const seen5=S.rev.has(5)&&unlocked();
    const remind=`<button class="cta" type="button" data-act="remind">${esc(t("remind"))}</button>`;
    const cc=i=>{
      const lk=proLocked(i);
      const cls="cc"+(lk?" is-lock":"")+(i===5?" final":"")+(i===5&&seen5?" v-"+VCLS(b.verdict):"");
      let inner;
      if (i<5) inner = lk ? paywallHTML() : `<div class="cc-big">${big[i]}</div><div class="cc-cap">${esc(sub[i])}</div><div class="cc-body">${body[i]}</div>${i===3?`<div class="cc-cta">${remind}</div>`:""}`;
      else if (!done) inner = `<div class="cc-big lk">${ic("lock")}</div><div class="cc-cap">${esc(t("locked"))}</div>`;
      else if (!unlocked()) inner = `<div class="cc-body">${gateHTML()}</div>`;
      else if (!seen5) inner = `<div class="cc-big lk">${ic("lock","idle")}</div>${S._cm?`<div class="cc-cta"><button class="cta" type="button" data-act="reveal">${esc(t("reveal"))}</button></div>`:""}`;
      else inner = `<div class="cc-big word" id="vword">${esc(L.vWord[b.verdict])}</div><div class="cc-body">${body[5]}</div>`;
      return `<article class="${cls}" data-card="${i}" aria-label="${esc(titles[i])}"><div class="cc-top"><span>0${i} · ${esc(titles[i])}</span>${(lk||(i===5&&!seen5))?ic("lock"):""}</div>${inner}</article>`;
    };
    if (only) return cc(only);
    return `<article class="rc cards ${isFull()?"pro":"free"}">
      <div class="rc-meta"><span>WAZO #${receiptNo(seed)}</span><span>${esc(dt)}</span></div>
      <h2 class="rc-idea">${esc(b.idea)}</h2>
      <div class="cs" id="cs">${[1,2,3,4,5].map(cc).join("")}</div>
    </article>`;
  }
}

  if (S.current){ const it=S.currentId?S.mine.find(x=>x.id===S.currentId):null; return {b:S.current, o:{id:S.currentId,date:it?.createdAt,killStatus:it?.killStatus}}; }
  return null;
}
const isCards=()=>matchMedia("(max-width:899px)").matches;

function goCard(i,instant){ const cs=$("#cs"), el=cs&&cs.querySelector(`.cc[data-card="${i}"]`); if(!el) return; S._tgt=i; const a=el.getBoundingClientRect(), r=cs.getBoundingClientRect(); cs.scrollBy({left:(a.left+a.width/2)-(r.left+r.width/2),behavior:(instant||calm())?"auto":"smooth"}); }
function syncDots(){ document.querySelectorAll("#cdots [data-dot]").forEach(d=>{ const n=+d.dataset.dot; d.setAttribute("aria-current",String(n===S.card)); d.classList.toggle("seen",S.rev.has(n)&&n!==S.card); }); }

function wrapLines(x,str,maxW,maxLines){
  const words=String(str||"").split(/\s+/).filter(Boolean), out=[]; let line="";
  for (const w of words){ const tryL=line?line+" "+w:w; if (x.measureText(tryL).width<=maxW || !line) line=tryL; else { out.push(line); line=w; } }
  if (line) out.push(line);
  if (out.length>maxLines){ const keep=out.slice(0,maxLines); let last=keep[maxLines-1]; while(last && x.measureText(last+"…").width>maxW) last=last.slice(0,-1); keep[maxLines-1]=last.trim()+"…"; return keep; }
  return out;
}

    +`<div style="display:grid;gap:8px">${S.me.email?"":`<label class="gl"><span>${esc(t("gEmail"))}</span><input id="delEmail" type="email" autocomplete="email" inputmode="email"></label>`}<button class="cta light" type="button" id="delBtn">${esc(t("delReq"))}</button><span class="note" id="delNote"></span></div><p class="upd">${esc(t("legalUpd"))}</p>`;
  $("#delBtn").addEventListener("click", async ()=>{
    const n=$("#delNote"), btn=$("#delBtn");
    const email=(S.me.email||($("#delEmail")?.value||"")).trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ n.textContent=t("delNo"); $("#delEmail")?.focus(); return; }
    btn.disabled=true;
    try{ const token=await humanToken(); const r=await api("lead",{action:"delete",email,token}); if(r.status!==200) throw 0; n.textContent=t("delSent"); S.me={name:"",email:""}; try{ localStorage.removeItem("wz.email"); localStorage.removeItem("wz.name"); }catch(e){} }
    catch(e){ btn.disabled=false; n.textContent=t("errGeneric"); }
  });
}
$("#legalBtn").addEventListener("click",()=>{ renderLegal(); const d=$("#legal"); d.dir=S.lang==="he"?"rtl":"ltr"; if(d.showModal) d.showModal(); else d.setAttribute("open",""); });
$("#legalX").addEventListener("click",()=>$("#legal").close());
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));
$("#teams").addEventListener("click",e=>{ if(e.target===e.currentTarget) e.currentTarget.close(); });
function setPro(on){ S.pro=!!on; const b=$("#proBtn"); b.textContent=S.pro?"PRO":"FREE"; b.setAttribute("aria-pressed",S.pro); try{ localStorage.setItem("wz.pro",S.pro?"1":"0"); }catch(e){} if (S.current && !S.busy) renderStage(); }
function enablePreview(){ $("#proBtn").hidden=false; setPro(S.proPreview); }
$("#proBtn").addEventListener("click",()=>setPro(!S.pro));
$("#legal").addEventListener("click",e=>{ if(e.target===e.currentTarget) e.currentTarget.close(); });
const langOpts=()=>LANGS.map(([k,name,code])=>`<button class="lopt" type="button" role="menuitemradio" data-lang="${k}" aria-checked="${k===S.lang}" lang="${k}" dir="${k==="he"?"rtl":"ltr"}"><span>${name}</span><small>${code}</small></button>`).join("");
const isSheet=()=>matchMedia("(max-width:699px)").matches;
function closeLangMenu(){ const m=$("#langMenu"); if(!m.hidden){ m.hidden=true; $("#langBtn").setAttribute("aria-expanded","false"); } }
function setLang(k){ if(!LANGS.some(x=>x[0]===k)) return; closeLangMenu(); const d=$("#langSheet"); if(d.open) d.close(); if(k===S.lang) return; S.lang=k; S.restoreLang=null; if(S.current) S.current._lang=k; try{localStorage.setItem("wz.lang",k)}catch(e){} applyLang(); }
$("#langBtn").addEventListener("click",e=>{ e.stopPropagation();
  if (isSheet()){ $("#langList").innerHTML=langOpts(); const d=$("#langSheet"); d.dir=S.lang==="he"?"rtl":"ltr"; $("#langTitle").textContent=t("langT"); if(d.showModal) d.showModal(); else d.setAttribute("open",""); return; }
  const m=$("#langMenu"); if(!m.hidden){ closeLangMenu(); return; } m.innerHTML=langOpts(); m.hidden=false; $("#langBtn").setAttribute("aria-expanded","true"); m.querySelector('[aria-checked="true"]')?.focus({preventScroll:true}); });
$("#langMenu").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(b) setLang(b.dataset.lang); });
$("#langList").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(b) setLang(b.dataset.lang); });
$("#langSheet").addEventListener("click",e=>{ if(e.target===e.currentTarget) e.currentTarget.close(); });
document.addEventListener("click",e=>{ if(!e.target.closest("#langMenu")) closeLangMenu(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeLangMenu(); } });

hydrateIcons(); applyLang();
/* newer example ideas published as /ideas.json replace the built-in ones */
(async function loadIdeas(){ try{ const r=await fetch("/ideas.json",{cache:"no-cache"}); if(!r.ok) return; const j=await r.json();
  if(!j||!Array.isArray(j.items)||j.items.length<6||String(j.updated||"")<=IDEAS_UPDATED) return;
  const ok=j.items.every(it=>["BUILD","PIVOT","KILL"].includes(it.v)&&FEED_LANGS.every(l=>it.cat&&it.cat[l]&&it.t&&it.t[l]&&it.l&&it.l[l]&&it.idea&&it.idea[l])); if(!ok) return;
  FEED.splice(0,FEED.length,...toFeed(j.items)); for(let i=FEED.length-1;i>0;i--){ const k=Math.floor(Math.random()*(i+1)); [FEED[i],FEED[k]]=[FEED[k],FEED[i]]; }
  renderRail(); renderStrips(); $("#exN").textContent=FEED.length; updExCount();
 }catch(e){} })();
["#rail","#stage","#drawerList"].forEach(sel=>{ const n=document.querySelector(sel); if(n) new MutationObserver(fitSoon).observe(n,{childList:true,subtree:true}); });
fitSoon();
if (location.hash==="#demo"){ S.current=norm({...EXAMPLE[S.lang],cur:CUR()}); S.current.full=false; S.isExample=false; history.replaceState(null,"","#receipt"); enablePreview(); }
show(location.hash.slice(1)); if (S.current) renderStage();
loadDrawer();
/* the landing page hands the idea over through this browser only (never in the URL) */
async function runHandoff(){
  let h=null; try{ h=JSON.parse(localStorage.getItem("wz.handoff")||"null"); localStorage.removeItem("wz.handoff"); }catch(e){}
  if (!h || typeof h!=="object") return;
  const text=String(h.text||"").slice(0,1200), mode=h.mode;
  S.fromSite=true;
  if (LANGS.some(x=>x[0]===h.lang) && h.lang!==S.lang){ S.lang=h.lang; try{ localStorage.setItem("wz.lang",h.lang); }catch(e){} applyLang(); }
  for (let k=0;k<60 && S.cfg.siteKey && !S.cfg.open && !window.turnstile;k++) await new Promise(r=>setTimeout(r,100));
  await ensureHuman();
  go("idea");
  { let img=null; try{ img=sessionStorage.getItem("wz.handoffImage"); sessionStorage.removeItem("wz.handoffImage"); }catch(e){} if (img && h.image) readImage(img); }
  if (mode==="none"){ $("#noIdeaBtn").click(); const ti=$("#topicIn"); if(ti){ ti.value=text; if(text) $("#topicGo").click(); } return; }
  $("#idea").value=text; fitIdea();
  if (mode==="enrich") $("#enrBtn").click();
  else if (mode==="check" && text.length>=8) runVerdict();
}
(async()=>{
  try{ const r=await fetch("/api/config",{cache:"no-store"}); if(r.ok) S.cfg={...S.cfg,...(await r.json())}; }catch(e){}
  let langSaved=null; try{ langSaved=localStorage.getItem("wz.lang"); }catch(e){}
  if (!langSaved && S.cfg.lang && LANGS.some(x=>x[0]===S.cfg.lang) && S.cfg.lang!==S.lang){ S.lang=S.cfg.lang; applyLang(); if (S.current) renderStage(); }
  S.ready=true; renderDrawer();
  if (S.cfg.open){ const tg=$("#testTag"); tg.hidden=false; tg.textContent=t("testTag"); }
  const add=(src,attrs,onload)=>{ const sc=document.createElement("script"); sc.src=src; sc.async=true; sc.defer=true; if(onload) sc.onload=onload; Object.entries(attrs||{}).forEach(([k,v])=>sc.setAttribute(k,v)); document.head.appendChild(sc); };
  if (S.cfg.siteKey && !S.cfg.open) add("https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit",{},()=>setTimeout(preverify,300));
  if (S.cfg.umami) add("https://cloud.umami.is/script.js",{"data-website-id":S.cfg.umami});
  if (S.cfg.paddleToken && !S.cfg.open) add("https://cdn.paddle.com/paddle/v2/paddle.js",{},()=>{
    if (!window.Paddle) return;
    if (S.cfg.paddleEnv==="sandbox") Paddle.Environment.set("sandbox");
    Paddle.Initialize({ token:S.cfg.paddleToken, eventCallback:e=>{ if(e.name==="checkout.completed") afterPay(); } });
  });
  if (!S.cfg.ready) setNote(t("errSetup"));
  runHandoff();
  if (S.me.email && !S.cfg.open) setTimeout(refreshPlan,1200);
})();
})();
</script>
