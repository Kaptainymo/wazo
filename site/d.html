<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wazo</title>
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Miriam+Libre:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#0E0E0E;--ink:#F1F0EC;--muted:#A8A6A0;--red:#F07167;--build:#A8DADC;--card:#1C1C1C;--lhr:1.5;--f-sans:"Hanken Grotesk","IBM Plex Sans Hebrew","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono","IBM Plex Sans Hebrew",ui-monospace,Menlo,monospace;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;line-height:round(calc(var(--lhr)*1em),2px)}
@supports not (width:round(1px,1px)){*,*::before,*::after{line-height:var(--lhr)}}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);font-size:16px;-webkit-font-smoothing:antialiased;min-height:100dvh}
main{width:min(100% - 40px,560px);margin:0 auto;padding:24px 0 64px;display:grid;gap:20px}
.brand{direction:ltr;unicode-bidi:isolate;justify-self:start;font-weight:700;letter-spacing:.04em;font-size:20px;text-decoration:none;color:inherit}
.brand sup{font-size:10px}
h1{margin:0;font-size:32px;--lhr:1.15;font-family:"Miriam Libre","Hanken Grotesk",sans-serif;font-weight:700}
p{margin:0}
#c{display:grid;gap:20px}
.lead{color:var(--muted);--lhr:1.55}
.idea{border:2px solid #2A2A2A;border-radius:16px;padding:16px;font-size:20px;font-weight:600;--lhr:1.35;overflow-wrap:anywhere}
.ilbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;font-weight:600;opacity:.7;margin-bottom:8px;display:block}
.dgrp{display:grid;gap:16px;background:var(--card);border-radius:20px;padding:20px}
.dq{display:grid;gap:12px}.dq b{font-weight:600}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{border:0;border-radius:999px;min-height:44px;padding:0 16px;font-family:inherit;font-size:16px;background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red);cursor:pointer}
.dchip[aria-pressed=true]{background:var(--red);color:#0A0A0A;font-weight:600}
.cta{height:52px;border:0;border-radius:999px;padding:0 28px;font-family:inherit;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;width:100%;text-decoration:none;cursor:pointer;background:#F4F3EF;color:#0A0A0A}
.cta:disabled{opacity:.6;cursor:default}
.cta.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(241,240,236,.4)}
.fine{font-size:14px;color:var(--muted)}
.dmsg{color:var(--red)}
.dh{font-size:24px;margin:0;font-weight:600;outline:none}
.cmprow{background:var(--card);border-radius:16px;padding:16px;display:grid;gap:8px}
.cmprow .tg{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;font-weight:600}
.cmprow.ok .tg{color:var(--build)}.cmprow.no .tg{color:var(--red)}
.cmprow strong{font-size:18px;font-weight:600}
.dtwo{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px}.dtwo b{font-weight:600}
.dtalk{background:var(--red);color:#0A0A0A;border-radius:20px;padding:20px;display:grid;gap:8px}
.dtalk .tg{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;font-weight:600;opacity:.7}
.dtalk strong{font-size:20px;--lhr:1.3;font-weight:600}
.dtalk.locked strong{filter:blur(5px);user-select:none}
.dtalk .cta{background:#0A0A0A;color:#fff}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main id="m" aria-live="polite"><a class="brand" href="/" aria-label="Wazo">WAZO<sup>®</sup></a><div id="c"></div></main>
<script src="/duet-shared.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s), W=window.WZD, esc=W.esc, c=$("#c");
const tok=location.pathname.split("/").filter(Boolean)[1]||"";
const guess=(navigator.language||"en").slice(0,2), L0=W.S[guess]?guess:"en";
let L=L0, st=null, a=[1,0,3];
const api=async(p)=>{ try{ const r=await fetch("/api/duet",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...p,token:tok})}); let d={}; try{ d=await r.json(); }catch(e){} return {status:r.status,data:d}; }catch(e){ return {status:0,data:{}}; } };
const setLang=l=>{ L=W.S[l]?l:"en"; document.documentElement.lang=L; document.documentElement.dir=L==="he"?"rtl":"ltr"; };
const show=(html,focus)=>{ c.innerHTML=html; if(focus){ const h=$("#duetH")||$("#c h1"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } } };
const msg=t=>`<p class="dmsg" role="status">${esc(t)}</p>`;
function gone(text){ show(`<h1>${esc(text)}</h1><a class="cta" href="/">${esc(W.str(L).tryOwn)}</a>`,true); }
function form(err){
  const d=W.str(L);
  show(`<h1>${esc(d.inviteT)}</h1><p class="lead">${esc(d.inviteP)}</p>
    <div><span class="ilbl">${esc(d.ideaLbl)}</span><div class="idea">${esc(st.idea)}</div></div>
    <div class="dgrp"><span class="ilbl">${esc(d.you)}</span>${W.questions(L,a)}</div>
    <p class="fine">${esc(d.seen)}</p>${err?msg(err):""}
    <button type="button" class="cta" id="go">${esc(d.go)}</button>`,true);
}
c.addEventListener("click",async e=>{
  const q=e.target.closest("[data-dq]"); if(q){ a[+q.dataset.dq]=+q.dataset.dv; q.parentElement.querySelectorAll(".dchip").forEach(x=>x.setAttribute("aria-pressed",String(x===q))); return; }
  if (e.target.closest("[data-dgo=pro]")){ location.href="/"; return; }
  const go=e.target.closest("#go"); if(!go) return;
  const d=W.str(L); go.disabled=true; go.textContent=d.sending;
  const r=await api({action:"answer",answers:a});
  if (r.status===200){ const x=r.data; show(W.compareHTML(L,a,x.owner_answers,x.talk_open,{proAction:'data-dgo="pro"'})+`<a class="cta" href="/">${esc(d.tryOwn)}</a><p class="fine">${esc(d.tryS)}</p>`,true); }
  else if (r.status===409) gone(d.already);
  else if (r.status===404) gone(d.gone);
  else form(d.err);
});
(async()=>{
  setLang(L0); c.innerHTML="";
  if (!/^[A-Za-z0-9_-]{32}$/.test(tok)) return gone(W.str(L).gone);
  const r=await api({action:"get"});
  if (r.status!==200) return gone(r.status===404?W.str(L).gone:W.str(L).err);
  st=r.data; setLang(st.lang); document.title="Wazo";
  if (st.answered) return gone(W.str(L).already);
  form();
})();
})();
</script></body></html>
